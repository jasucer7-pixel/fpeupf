<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d55c8"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Organiza el estudio, concéntrate y no te agobies. Para FPE en la UPF.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Segunda Mente FPE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — side rail on desktop, bottom tab bar on phones; one calm column of cards per view. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#eceef3; --ink:#161b26; --muted:#5a6273; --line:#dde1e8;
  --accent:#2d55c8; --accent-ink:#ffffff; --accent-soft:#e5ebfa;
  --ok:#157a3c; --ok-soft:#e1f3e7; --warn:#a85a06; --warn-soft:#fbefdc; --danger:#b42323; --danger-soft:#fbe4e4;
  --gold:#a8730a; --gold-soft:#f8eed3;
  --heat0:#e6e9ef; --heat1:#c3d0f3; --heat2:#8ea7ea; --heat3:#5277db; --heat4:#2d55c8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgb(20 30 60 / .06), 0 6px 20px rgb(20 30 60 / .05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#161a22; --surface-2:#1e2330; --ink:#e7eaf1; --muted:#99a2b4; --line:#2a3040;
  --accent:#86a2ff; --accent-ink:#0e1117; --accent-soft:#1d2849;
  --ok:#5bd28a; --ok-soft:#13291c; --warn:#f2b54a; --warn-soft:#2d2210; --danger:#f58a8a; --danger-soft:#331616;
  --gold:#f0c35a; --gold-soft:#2e2510;
  --heat0:#1e2330; --heat1:#25345f; --heat2:#3a5299; --heat3:#5c7ad6; --heat4:#86a2ff;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161a22; --surface-2:#1e2330; --ink:#e7eaf1; --muted:#99a2b4; --line:#2a3040;
  --accent:#86a2ff; --accent-ink:#0e1117; --accent-soft:#1d2849;
  --ok:#5bd28a; --ok-soft:#13291c; --warn:#f2b54a; --warn-soft:#2d2210; --danger:#f58a8a; --danger-soft:#331616;
  --gold:#f0c35a; --gold-soft:#2e2510;
  --heat0:#1e2330; --heat1:#25345f; --heat2:#3a5299; --heat3:#5c7ad6; --heat4:#86a2ff;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.85rem;letter-spacing:-.01em} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.rail{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px))}
.brand{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.72rem;font-weight:600;padding:6px 8px;border-radius:10px;min-width:56px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab .badge{position:absolute;top:2px;right:10px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.tab.desk{display:none}
.rail-foot{display:none}
main{padding-block:20px 110px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));min-width:0}
.view{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .rail{position:sticky;top:0;inset:auto;height:100vh;flex-direction:column;justify-content:flex-start;gap:3px;border-top:0;border-right:1px solid var(--line);padding:22px 14px;overflow-y:auto}
  .brand{display:block;font-family:var(--f-display);font-weight:700;font-size:1.15rem;padding:4px 10px 16px;line-height:1.2}
  .brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.75rem;color:var(--muted);margin-top:4px}
  .tab{flex-direction:row;gap:10px;font-size:.92rem;padding:9px 12px;justify-content:flex-start}
  .tab svg{width:20px;height:20px}
  .tab.desk{display:flex} .tab.mob{display:none}
  .tab .badge{position:static;margin-left:auto}
  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
  .rail .rail-lvl{display:block}
  main{padding-block:36px 48px}
}
.rail-lvl{display:none;padding:12px;border-radius:12px;background:var(--surface-2);font-size:.8rem;margin-bottom:8px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top .meta{color:var(--muted);font-size:.85rem;font-weight:500;margin-bottom:4px;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.quiet{background:transparent;box-shadow:none;border-style:dashed}
.card.hero{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.lg{padding:12px 20px;font-size:1rem}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.danger{color:var(--danger)}
.icon-btn{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{color:var(--warn)}
.icon-btn.solid{background:var(--accent);color:var(--accent-ink)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0;flex:1}
label.chk{display:flex;gap:8px;align-items:center;font-size:.88rem;font-weight:500}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600;background:var(--surface);white-space:nowrap}
button.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pill{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.examen{background:var(--danger-soft);color:var(--danger)}
.pill.entrega{background:var(--warn-soft);color:var(--warn)}
.pill.lectura{background:var(--accent-soft);color:var(--accent)}
.pill.repaso{background:var(--ok-soft);color:var(--ok)}
.due{font-size:.78rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{color:var(--danger)} .due.soon{color:var(--warn)} .due.ok{color:var(--muted)}
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);min-width:0}
.task:first-child{border-top:0}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task .t{font-weight:500;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.task .t:hover{color:var(--accent)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.task .acts{display:flex;gap:0;flex:none}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check svg{width:14px;height:14px}
.group-h{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 0 2px}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.quote{font-family:var(--f-display);font-weight:500;font-size:1.12rem;line-height:1.35}
.quote cite{display:block;font-family:var(--f-body);font-style:normal;font-size:.82rem;color:var(--muted);margin-top:6px}
.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.energy button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:.85rem}
.energy button span{font-size:.72rem;font-weight:500;color:var(--muted);text-align:center}
.energy button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:28px;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:3px;opacity:.85}
.bar.zero i{background:var(--line)}
.bar.today i{opacity:1}
.bar b{font-size:.7rem;color:var(--muted);font-weight:600}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat .n{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:.78rem;color:var(--muted)}
/* hero goal */
.goal{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.goal-ring{position:relative;width:104px;height:104px;flex:none}
.goal-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal-ring circle{fill:none;stroke-width:10}
.goal-ring .trk{stroke:var(--surface-2)} .goal-ring .prg{stroke:var(--accent);stroke-linecap:round}
.goal-ring.met .prg{stroke:var(--ok)}
.goal-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.goal-ring .c b{font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.goal-ring .c span{font-size:.7rem;color:var(--muted)}
.goal .info{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.why{font-family:var(--f-display);font-weight:500;font-size:1rem;line-height:1.3}
.xpbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:999px}
.coin{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.coin::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-soft)}
/* focus */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.ring{position:relative;width:min(280px,72vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .trk{stroke:var(--surface-2)}
.ring .prg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.ring.brk .prg{stroke:var(--ok)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:0 24px}
.ring .time{font-family:var(--f-mono);font-size:clamp(2.4rem,11vw,3.4rem);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .mode{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.counter{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem}
.counter b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.zen{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px max(16px, env(safe-area-inset-right,0px)) 24px max(16px, env(safe-area-inset-left,0px));text-align:center}
.zen .time{font-family:var(--f-mono);font-size:clamp(4rem,20vw,9rem);font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.zen .int{font-family:var(--f-display);font-size:1.3rem;max-width:30ch}
/* notes */
.note{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.note:first-child{border-top:0}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.note .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.pill.idea{background:var(--accent-soft);color:var(--accent)}
.pill.duda{background:var(--warn-soft);color:var(--warn)}
.pill.descarga{background:var(--surface-2);color:var(--muted)}
.pill.apunte{background:var(--ok-soft);color:var(--ok)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
/* calm */
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.orb{width:180px;height:180px;max-width:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%, var(--accent-soft), var(--surface-2));border:1px solid var(--line);transform:scale(.62);transition:transform 4s ease-in-out}
.orb span{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--ink);transform:scale(1.4)}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.step{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);flex-wrap:wrap}
.step::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:700;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.step .body{flex:1;min-width:160px}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.cols{grid-template-columns:1fr 1fr}}
.col{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.col li{overflow-wrap:anywhere}
.col ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
/* week */
.week{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:760px){.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}}
.day{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:60px}
.day.today{outline:2px solid var(--accent);background:var(--accent-soft)}
.day h3{font-size:.85rem;display:flex;justify-content:space-between;gap:4px}
.day h3 span{color:var(--muted);font-family:var(--f-body);font-weight:600;font-size:.75rem}
.wt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem;display:flex;gap:6px;align-items:flex-start;min-width:0}
.wt span:not(.dot){overflow-wrap:anywhere;flex:1;min-width:0}
.wt.done span{text-decoration:line-through;color:var(--muted)}
.wt.dl{border-style:dashed}
.wt .dot{margin-top:5px}
/* exams */
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.exam{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.exam .big{font-family:var(--f-display);font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.exam .big small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:4px}
/* timetable */
.tt{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:.88rem;min-width:0}
.slot .h{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.slot .n{flex:1;min-width:0;overflow-wrap:anywhere}
/* flashcards */
.fcard{border:1px solid var(--line);border-radius:16px;padding:28px 22px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:var(--surface);box-shadow:var(--shadow)}
.fcard .q{font-family:var(--f-display);font-size:1.3rem;font-weight:500;line-height:1.3;overflow-wrap:anywhere;white-space:pre-wrap}
.fcard .a{font-size:1.02rem;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:16px;width:100%}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:600;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades button span{font-size:.7rem;color:var(--muted);font-weight:500}
.grades button:nth-child(1){border-color:var(--danger)} .grades button:nth-child(4){border-color:var(--ok)}
.deck{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.deck:first-child{border-top:0}
.deck .n{flex:1;min-width:0;font-weight:600}
/* progress */
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:3px;background:var(--heat0)}

const QUOTES = [

const DEFAULT_REWARDS = [["Un episodio de tu serie",60],["Merienda especial",40],["Tarde libre sin culpa",250],["Plan con amigos",150]];

/* ================= state ================= */
const defaultSettings = () => ({ focus:25, brk:5, longBrk:15, longEvery:4, autoNext:false, termStart:"2026-09-21", dailyGoal:120, why:"", theme:"auto", notify:false, sound:"", vol:0.4 });
const defaultState = () => ({ v:2, updated:0, onboarded:false, name:"",
  subjects:[], tasks:[], notes:[], sessions:[], checkins:{}, control:[],
  cards:[], timetable:[], journal:{}, reviews:{}, rewards:[], redeemed:[], badges:{}, xp:0, spent:0, goalDays:{},
  settings:defaultSettings() });
function migrate(raw){
  const s = Object.assign(defaultState(), raw || {});
  s.settings = Object.assign(defaultSettings(), (raw && raw.settings) || {});
  ["subjects","tasks","notes","sessions","control","cards","timetable","rewards","redeemed"].forEach(k => { if (!Array.isArray(s[k])) s[k] = []; });
  ["checkins","journal","reviews","badges","goalDays"].forEach(k => { if (!s[k] || typeof s[k] !== "object" || Array.isArray(s[k])) s[k] = {}; });
  s.subjects.forEach(x => { if (x.weekly == null) x.weekly = 4; });
  if ((raw && raw.v || 1) < 2){
    // v1 → v2: "today" flag becomes a planned date; seed XP from history so nothing is lost
    s.tasks.forEach(t => { if (t.today && !t.done) t.plan = dkey(); delete t.today; });
    s.xp = s.sessions.reduce((a,x) => a + (x.min||0), 0) + s.tasks.filter(t => t.done).length * 10;
    if (!s.rewards.length) s.rewards = DEFAULT_REWARDS.map(([text,cost]) => ({id:uid(), text, cost}));
    s.v = 2;
  }
  return s;
}
let S = defaultState();
try { const raw = localStorage.getItem(LS); if (raw) S = migrate(JSON.parse(raw)); } catch(e){}
let dbRef = null, saveT = null, syncMode = "local", downloads = null;
function save(){
  S.updated = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
  if (dbRef){ clearTimeout(saveT); saveT = setTimeout(pushRemote, 600); }
}
function pushRemote(){
  if (!dbRef) return;
  dbRef.set(JSON.parse(JSON.stringify(S))).catch(err => {
    if (err && err.code === "unavailable") setTimeout(pushRemote, 1500 + Math.random()*1500);
    else if (err && (err.code === "invalid_argument" || err.code === "revoked")) { dbRef = null; syncMode = "local"; paintSync(); }
    else if (err && err.code === "quota_exceeded") toast("Tus datos ocupan demasiado. Descarga una copia y borra notas antiguas.");
  });
}
function trim(){
  const cutoff = Date.now() - 400*864e5;
  S.sessions = S.sessions.filter(s => s.ts > cutoff);
  const keys = Object.keys(S.checkins).sort(); while (keys.length > 120) delete S.checkins[keys.shift()];
}
const subj = id => S.subjects.find(s => s.id === id);
const subjName = id => subj(id)?.name || "General";
const subjColor = id => subj(id)?.color || "var(--muted)";

/* ================= gamification ================= */
const lvlNeed = n => 150 * n;          // XP to go from level n to n+1
function level(){
  let xp = S.xp, n = 1;
  while (xp >= lvlNeed(n)) { xp -= lvlNeed(n); n++; }
  return {n, into:xp, need:lvlNeed(n), title:LEVELS[Math.min(n-1, LEVELS.length-1)]};
}
const coins = () => Math.max(0, Math.floor(S.xp/5) - S.spent);
function gainXP(n, quiet){
  const before = level().n; S.xp = Math.max(0, S.xp + n);
  const after = level();
  if (after.n > before && !quiet) setTimeout(() => toast("Subes a nivel " + after.n + ": " + after.title), 900);
}
const BADGES = [
  ["primer","Primer bloque","Completa un bloque de foco", s => s.sessions.length >= 1],
  ["cinco","Día redondo","5 bloques en un mismo día", s => Math.max(0, ...Object.values(byDay(s)).map(d => d.n)) >= 5],

  ["r3","Racha de 3","3 días seguidos estudiando", () => bestStreak() >= 3],

  ["deep","Inmersión","Un bloque de 50 minutos o más", s => s.sessions.some(x => x.min >= 50)],

  ["exam","Previsión","Crea un plan de repaso para un examen", s => s.tasks.some(t => t.planned)]
];
const totalMin = s => s.sessions.reduce((a,x) => a + x.min, 0);
function byDay(s){ const o = {}; s.sessions.forEach(x => { const k = dkey(new Date(x.ts)); o[k] = o[k] || {m:0,n:0}; o[k].m += x.min; o[k].n++; }); return o; }
function bestStreak(){
  const days = Object.keys(byDay(S)).sort(); let best = 0, cur = 0, prev = null;
  days.forEach(k => { cur = prev && daysBetween(parseD(prev), parseD(k)) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = k; });
  return best;
}
function checkBadges(){
  const fresh = BADGES.filter(([id,,,test]) => !S.badges[id] && test(S));
  fresh.forEach(([id]) => S.badges[id] = Date.now());

  return fresh.length;
}
function checkGoal(){
  const k = dkey();

}

/* ================= capabilities (optional, only inside Claude) ================= */
let sample = null;
async function connect(){
  const C = window.claude; if (!C || !C.use) return;
  try {
    const [db, user] = await Promise.all([C.use("db"), C.use("user")]);
    if (db && user){
      const id = await user.id();
      if (id){
        const ref = db.doc("data/users/" + id + "/state");
        const snap = await ref.get();
        const remote = snap.exists ? snap.data() : null;
        dbRef = ref; syncMode = "cloud";
        if (remote && (remote.updated||0) > (S.updated||0)) { S = migrate(JSON.parse(JSON.stringify(remote))); try{localStorage.setItem(LS, JSON.stringify(S));}catch(e){} if ((remote.v||1) < 2) save(); render(); }
        else if (S.updated) pushRemote();
        ref.onSnapshot(s => {
          if (!s.exists || s.metadata.hasPendingWrites) return;
          const d = s.data();
          if ((d.updated||0) > (S.updated||0)) {
            S = migrate(JSON.parse(JSON.stringify(d)));
            try{localStorage.setItem(LS, JSON.stringify(S));}catch(e){}
            const a = document.activeElement;
            if (!(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) render();
          }
        }, () => {});
        paintSync();
      }
    }
  } catch(e){}
  try { downloads = await C.use("downloads"); } catch(e){ downloads = null; }
  try { sample = await C.use("sample"); } catch(e){ sample = null; }
  if (sample) render();
}

function applyTheme(){
  const th = S.settings.theme;
  if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th);
  else if (!IN_CLAUDE) document.documentElement.removeAttribute("data-theme");
}

/* ================= derived ================= */
function termInfo(){
  const d = daysBetween(parseD(S.settings.termStart || "2026-09-21"), new Date());
  if (d < 0) return "Antes del trimestre";
  const w = Math.floor(d/7) + 1;
  if (w <= 10) return "Semana " + w + " de 10";
  if (w <= 13) return "Periodo de exámenes";
  return "Entre trimestres";
}
function dueInfo(due){
  if (!due) return null;
  const n = daysBetween(new Date(), parseD(due));
  let txt, cls;
  if (n < 0) { txt = n === -1 ? "ayer" : "hace " + (-n) + " días"; cls = "late"; }
  else if (n === 0) { txt = "hoy"; cls = "late"; }
  else if (n === 1) { txt = "mañana"; cls = "soon"; }
  else if (n <= 6) { txt = "en " + n + " días"; cls = "soon"; }
  else { txt = shortDate(due); cls = "ok"; }
  return {n, txt, cls};
}
function minutesOn(k){ return S.sessions.filter(s => dkey(new Date(s.ts)) === k).reduce((a,s) => a + s.min, 0); }
function streak(){
  let n = 0; const d = new Date();
  if (!minutesOn(dkey(d))) d.setDate(d.getDate()-1);
  while (minutesOn(dkey(d)) > 0) { n++; d.setDate(d.getDate()-1); }
  return n;
}
const todayCheck = () => S.checkins[dkey()] || null;
const capacity = () => ({baja:1, media:3, alta:4})[todayCheck()?.energy] || 3;
const byDue = (a,b) => (a.due||"9999") < (b.due||"9999") ? -1 : (a.due||"9999") > (b.due||"9999") ? 1 : 0;
const dueCards = (sid) => S.cards.filter(c => (!sid || c.subjectId === sid) && (c.due || "") <= dkey());
function weekMinBySubject(){ const m = monday(), o = {}; S.sessions.filter(s => dkey(new Date(s.ts)) >= m).forEach(s => o[s.subjectId||""] = (o[s.subjectId||""]||0) + s.min); return o; }

  const item = (v, l, cls="") => `<button class="tab ${cls}" data-go="${v}" ${view===v?'aria-current="page"':''}>${ICON[v]}${l}${v==="repasar" && dc ? `<span class="badge">${dc}</span>`:""}</button>`;
  $("#rail").innerHTML = `<div class="brand">Segunda Mente<small>FPE · UPF</small></div>
    ${NAV.map(([v,l]) => item(v, l, MOBILE.includes(v) ? "" : "desk")).join("")}
    <button class="tab mob" data-act="more" ${!MOBILE.includes(view)?'aria-current="page"':''}>${ICON.more}Más${dc?`<span class="badge">${dc}</span>`:""}</button>

      <div class="rail-lvl"><div class="row" style="justify-content:space-between"><b>Nivel ${lv.n}</b><span class="coin">${coins()}</span></div><div class="muted" style="margin:2px 0 6px">${lv.title}</div><div class="xpbar"><i style="width:${Math.round(lv.into/lv.need*100)}%"></i></div></div>

function render(){
  applyTheme();
  renderRail();
  const el = $("#view");
  if (!S.onboarded) { el.innerHTML = vOnboard(); return; }
  el.innerHTML = ({hoy:vHoy, foco:vFoco, plan:vPlan, repasar:vRepasar, mente:vMente, progreso:vProgreso, calma:vCalma})[view]();
  if (view === "foco") paintTimer();
  if (view === "mente") { const c = $(".chat"); if (c) c.scrollTop = c.scrollHeight; }
  paintSync();
}
function paintSync(){
  document.querySelectorAll("[data-sync]").forEach(n => {
    n.className = "sync" + (syncMode === "cloud" ? " cloud" : "");
    n.innerHTML = "<i></i>" + (syncMode === "cloud" ? "Guardado en tu cuenta de Claude" : "Guardado en este navegador");
  });
}
function header(title, meta, extra=""){
  return `<header class="top"><div style="min-width:0"><div class="meta">${meta}</div><h1>${title}</h1></div>
  <div class="row" style="flex:none">${extra}<button class="icon-btn" data-act="settings" aria-label="Ajustes" title="Ajustes">${ICON.settings}</button></div></header>`;
}
function taskRow(t, opts={}){
  const di = dueInfo(t.due), today = dkey();
  const planned = t.plan === today;
  return `<div class="task${t.done?" done":""}" data-id="${t.id}">
    <button class="check${t.done?" on":""}" data-act="toggle-task" aria-label="${t.done?"Marcar como pendiente":"Marcar como hecha"}">${t.done?ICON.check:""}</button>
    <div class="body"><button class="t" data-act="edit-task" title="Editar">${esc(t.title)}</button>
      <span class="sub"><span class="row" style="gap:5px"><span class="dot" style="background:${subjColor(t.subjectId)}"></span>${esc(subjName(t.subjectId))}</span>
      ${t.type && t.type!=="tarea" ? `<span class="pill ${t.type}">${TYPES[t.type]}</span>`:""}
      ${t.est ? `<span>${t.est} min</span>`:""}
      ${t.repeat ? `<span title="Se repite cada semana">semanal</span>`:""}
      ${di && !t.done ? `<span class="due ${di.cls}">${t.type==="examen"?"examen ":"vence "}${di.txt}</span>`:""}
      ${t.plan && !t.done && !planned && opts.showPlan ? `<span>planificada ${shortDate(t.plan)}</span>`:""}</span></div>
    <div class="acts">
      ${!t.done ? `<button class="icon-btn" data-act="focus-task" aria-label="Empezar foco con esta tarea" title="Empezar foco">${ICON.play}</button>`:""}
      ${!t.done && opts.today!==false ? `<button class="icon-btn${planned?" on":""}" data-act="today-task" aria-label="${planned?"Quitar de hoy":"Hacer hoy"}" title="${planned?"Quitar de hoy":"Hacer hoy"}">${planned?ICON.sunOn:ICON.sun}</button>`:""}
      ${opts.split && sample && !t.done ? `<button class="icon-btn" data-act="split-task" aria-label="Trocear en pasos pequeños" title="Trocear con IA">${ICON.split}</button>`:""}
      ${opts.del ? `<button class="icon-btn" data-act="del-task" aria-label="Borrar tarea" title="Borrar">${ICON.trash}</button>`:""}
    </div></div>`;
}
function subjOptions(sel, withNone=true){

let qIdx = Math.floor(Date.now()/864e5) % QUOTES.length;
function goalRing(min, goal, size=104){
  const p = Math.min(1, min/goal), C = 2*Math.PI*42;
  return `<div class="goal-ring${p>=1?" met":""}" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="42"/><circle class="prg" cx="50" cy="50" r="42" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>
    <div class="c"><b>${min}</b><span>de ${goal} min</span></div></div>`;
}

function weekBars(){
  const days = [...Array(7)].map((_,i) => { const d = new Date(); d.setDate(d.getDate()-6+i); return {d, m:minutesOn(dkey(d))}; });
  const max = Math.max(S.settings.dailyGoal, ...days.map(x => x.m));
  const week = days.reduce((a,x) => a + x.m, 0);
  return `<div class="stats"><div class="stat"><div class="n">${minutesOn(dkey())}</div><div class="l">min hoy</div></div>
      <div class="stat"><div class="n">${hours(week)}</div><div class="l">horas en 7 días</div></div>
      <div class="stat"><div class="n">${streak()}</div><div class="l">días seguidos</div></div></div>
      <div class="bars" role="img" aria-label="Minutos de foco por día, últimos 7 días">${days.map((x,i) => `<div class="bar${x.m?"":" zero"}${i===6?" today":""}" title="${x.m} min"><i style="height:${Math.max(3, Math.round(x.m/max*70))}px;${x.m>=S.settings.dailyGoal?"background:var(--ok)":""}"></i><b>${"DLMXJVS"[x.d.getDay()]}</b></div>`).join("")}</div>`;
}

let wake = null;
async function keepAwake(on){
  try { if (on && "wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } else if (!on && wake) { await wake.release(); wake = null; } } catch(e){ wake = null; }

let actx = null;
function ctx(){ if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (actx && actx.state === "suspended") actx.resume(); return actx; }
function chime(){
  const A = ctx(); if (!A) return;
  [660, 880, 990].forEach((f,i) => { const o = A.createOscillator(), g = A.createGain(); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0.0001, A.currentTime + i*.18); g.gain.exponentialRampToValueAtTime(0.2, A.currentTime + i*.18 + .02); g.gain.exponentialRampToValueAtTime(0.0001, A.currentTime + i*.18 + .6); o.connect(g).connect(A.destination); o.start(A.currentTime + i*.18); o.stop(A.currentTime + i*.18 + .65); });
}
const audio = {kind:"", src:null, gain:null};
function setAmbient(kind){
  if (audio.src){ try { audio.src.stop(); } catch(e){} audio.src = null; }
  audio.kind = kind || "";
  if (!kind) return;
  const A = ctx(); if (!A) return;
  const len = A.sampleRate * 6, buf = A.createBuffer(1, len, A.sampleRate), d = buf.getChannelData(0);
  let last = 0, b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random()*2 - 1;
    if (kind === "marron"){ last = (last + 0.02*w) / 1.02; d[i] = last * 3.2; }
    else if (kind === "lluvia"){ b0 = 0.99765*b0 + w*0.099046; b1 = 0.963*b1 + w*0.2965164; b2 = 0.57*b2 + w*1.0526913; d[i] = (b0 + b1 + b2 + w*0.1848) * 0.09; }
    else d[i] = w * 0.18;
  }
  // crossfade loop edges to avoid a click
  const f = Math.floor(A.sampleRate*0.3); for (let i = 0; i < f; i++){ const k = i/f; d[i] = d[i]*k + d[len-f+i]*(1-k); }
  const src = A.createBufferSource(); src.buffer = buf; src.loop = true; src.loopEnd = (len - f)/A.sampleRate;
  const g = A.createGain(); g.gain.value = S.settings.vol;
  let node = src;
  if (kind === "lluvia"){ const hp = A.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 500; node.connect(hp); node = hp; }
  node.connect(g).connect(A.destination); src.start();
  audio.src = src; audio.gain = g;
}

function schedule(c, q, dry){
  c.ease = c.ease || 2.5; c.reps = c.reps || 0; c.interval = c.interval || 0;
  let iv;
  if (q === 0){ c.reps = 0; iv = 0; c.ease = Math.max(1.3, c.ease - 0.2); }
  else {
    if (c.reps === 0) iv = q === 1 ? 1 : q === 2 ? 1 : 3;
    else if (c.reps === 1) iv = q === 1 ? 2 : q === 2 ? 3 : 5;
    else iv = Math.max(c.interval + 1, Math.round(c.interval * (q === 1 ? 1.2 : q === 2 ? c.ease : c.ease * 1.3)));
    c.ease = Math.max(1.3, c.ease + (q === 1 ? -0.15 : q === 3 ? 0.15 : 0));
    c.reps++;
  }
  if (dry) return iv;
  c.interval = iv; c.due = addDays(dkey(), iv); c.seen = (c.seen||0) + 1;
  return iv;
}

function breathStep(i){
  if (!br.on) return;
  const P = PATTERNS[br.pattern], [label, secs, scale] = P[i % P.length];
  br.phase = label;
  const orb = $("#orb"), t = $("#orb-t");
  if (orb){ orb.style.transitionDuration = secs + "s"; orb.style.transform = "scale(" + scale + ")"; }
  let left = secs; if (t) t.textContent = label + " " + left;
  const tick = setInterval(() => { left--; const tt = $("#orb-t"); if (tt && left > 0) tt.textContent = label + " " + left; }, 1000);
  br.t = setTimeout(() => { clearInterval(tick); breathStep(i+1); }, secs*1000);
  br.tick = tick;
}
function breathStop(){ br.on = false; clearTimeout(br.t); clearInterval(br.tick); clearTimeout(br.end); br.phase = ""; }

    case "zen-exit": zen = false; renderZen(); try { if (document.fullscreenElement) document.exitFullscreen().catch(()=>{}); } catch(err){} render(); break;
    case "sound": ctx(); setAmbient(a.dataset.v); render(); break;
    case "park": { const v = $("#park").value.trim(); if (!v) break; S.notes.push({id:uid(), kind:"descarga", text:v, subjectId:"", ts:Date.now()}); parked.push(v); save(); render(); setTimeout(() => $("#park")?.focus()); break; }
    case "plan-tab": planTab = a.dataset.v; render(); break;
    case "plan-edit": planEdit = !planEdit; render(); break;
    case "plan-filter": planFilter = a.dataset.v; render(); break;
    case "show-done": showDone = !showDone; render(); break;
    case "week-prev": weekOff--; render(); break;
    case "week-next": weekOff++; render(); break;
    case "week-now": weekOff = 0; render(); break;
    case "goto-subjects": planTab = "asignaturas"; planEdit = true; go("plan"); break;
    case "subj-add": { const v = $("#new-subj").value.trim(); if (!v) break; S.subjects.push({id:uid(), name:v, color:COLORS[S.subjects.length % COLORS.length], ects:6, weekly:4}); save(); render(); setTimeout(() => $("#new-subj")?.focus()); break; }
    case "subj-del": { const sid = a.closest("[data-sid]").dataset.sid; S.subjects = S.subjects.filter(s => s.id !== sid); S.tasks.forEach(t => { if (t.subjectId === sid) t.subjectId = ""; }); S.timetable = S.timetable.filter(c => c.subjectId !== sid); if (planFilter === sid) planFilter = ""; save(); render(); break; }
    case "subj-color": { const s = subj(a.closest("[data-sid]").dataset.sid); s.color = COLORS[(COLORS.indexOf(s.color)+1) % COLORS.length]; save(); render(); break; }
    case "add-task": {
      const title = $("#nt-title").value.trim(); if (!title){ $("#nt-title").focus(); toast("Escribe primero qué tienes que hacer."); break; }
      addTask({title, subjectId:$("#nt-subj").value, type:$("#nt-type").value, due:$("#nt-due").value, plan:$("#nt-plan").value, est:parseInt($("#nt-est").value)||0, repeat:$("#nt-rep").checked});
      render(); toast("Tarea añadida"); setTimeout(() => $("#nt-title")?.focus()); break; }
    case "exam-plan": if (task){ const n = examPlan(task); render(); toast(n ? "Creadas " + n + " sesiones de repaso en tu semana." : "El examen está demasiado cerca para un plan espaciado: haz un repaso hoy."); } break;
    case "tt-add": { const sid = $("#tt-subj").value; if (!sid){ toast("Añade antes una asignatura."); break; } S.timetable.push({id:uid(), day:+$("#tt-day").value, subjectId:sid, start:$("#tt-start").value||"09:00", end:$("#tt-end").value||"10:30", room:$("#tt-room").value.trim()}); save(); render(); toast("Clase añadida"); break; }
    case "tt-del": { const id = a.closest("[data-cid]").dataset.cid; S.timetable = S.timetable.filter(c => c.id !== id); save(); render(); break; }
    case "start-review": startReview(""); break;
    case "review-subj": startReview(a.dataset.sid || ""); break;
    case "review-exit": rv = null; render(); break;
    case "flip": if (rv){ rv.show = true; render(); } break;
    case "grade": {
      if (!rv) break; const c = S.cards.find(x => x.id === rv.queue[0]); const q = +a.dataset.v;
      rv.queue.shift(); if (c){ schedule(c, q); gainXP(1, true); if (q === 0) rv.queue.splice(Math.min(rv.queue.length, 3), 0, c.id); else rv.done++; }
      rv.show = false; checkBadges(); save(); render(); break; }
    case "card-add": { const q = $("#c-q").value.trim(), an = $("#c-a").value.trim(); if (!q || !an){ toast("Escribe pregunta y respuesta."); break; } cardsSubj = $("#c-subj").value; S.cards.push({id:uid(), subjectId:cardsSubj, q, a:an, due:dkey(), created:Date.now()}); save(); render(); toast("Tarjeta añadida"); setTimeout(() => $("#c-q")?.focus()); break; }
    case "card-bulk": { cardsSubj = $("#c-subj").value; const lines = $("#c-bulk").value.split("\n").map(l => l.split("::")).filter(p => p.length >= 2 && p[0].trim() && p[1].trim()); lines.forEach(p => S.cards.push({id:uid(), subjectId:cardsSubj, q:p[0].trim(), a:p.slice(1).join("::").trim(), due:dkey(), created:Date.now()})); save(); render(); toast(lines.length ? "Añadidas " + lines.length + " tarjetas" : "No he encontrado líneas con «::»"); break; }
    case "card-ai": aiMakeCards(); break;
    case "card-ai-save": { const keep = [...document.querySelectorAll("[data-aic]")].filter(x => x.checked).map(x => aiCards[+x.dataset.aic]); keep.forEach(c => S.cards.push({id:uid(), subjectId:cardsSubj, q:c.q, a:c.a, due:dkey(), created:Date.now()})); aiCards = null; save(); render(); toast("Guardadas " + keep.length + " tarjetas"); break; }
    case "card-ai-clear": aiCards = null; render(); break;
    case "card-del": { const id = a.closest("[data-card]").dataset.card; S.cards = S.cards.filter(c => c.id !== id); save(); render(); break; }
    case "note-kind": noteKind = a.dataset.v; { const keep = $("#note-text").value; render(); $("#note-text").value = keep; $("#note-text").focus(); } break;
    case "note-filter": noteFilter = a.dataset.v; render(); break;
    case "add-note": {
      const raw = $("#note-text").value.trim(); if (!raw) break;
      const parts = noteKind === "descarga" ? raw.split(/\n+/).map(s => s.replace(/^[-*•]\s*/,"").trim()).filter(Boolean) : [raw];
      parts.forEach((p,i) => S.notes.push({id:uid(), kind:noteKind, text:p, subjectId:$("#note-subj").value, ts:Date.now()+i}));
      if (noteKind === "descarga") S.dumps = (S.dumps||0) + 1;
      checkBadges(); save(); render(); toast(noteKind === "descarga" ? "Fuera de tu cabeza. Ahora decide qué hacer con cada cosa." : "Nota guardada"); break; }
    case "note-pin": { const n = S.notes.find(x => x.id === a.closest("[data-nid]").dataset.nid); n.pinned = !n.pinned; save(); render(); break; }
    case "note-del": { const id = a.closest("[data-nid]").dataset.nid, n = S.notes.find(x => x.id === id); S.notes = S.notes.filter(x => x.id !== id); save(); render(); toast(n?.kind === "descarga" ? "Soltado." : "Nota borrada"); break; }
    case "note-task": { const id = a.closest("[data-nid]").dataset.nid, n = S.notes.find(x => x.id === id); addTask({title:n.text.slice(0,140), subjectId:n.subjectId||""}); if (n.kind === "descarga") S.notes = S.notes.filter(x => x.id !== id); save(); render(); toast("Ahora está en Plan"); break; }
    case "note-card": { const n = S.notes.find(x => x.id === a.closest("[data-nid]").dataset.nid); cardsSubj = n.subjectId || ""; rv = null; go("repasar"); setTimeout(() => { const q = $("#c-q"), an = $("#c-a"); if (n.kind === "duda") { q.value = n.text; an.focus(); } else { an.value = n.text; q.focus(); } }, 30); break; }
    case "chat-sug": sendChat(a.dataset.q); break;
    case "chat-send": { const i = $("#chat-in"); const v = i.value; i.value = ""; sendChat(v); break; }
    case "chat-clear": chatCtl?.abort(); chat = []; chatBusy = false; render(); break;
    case "redeem": { const r = S.rewards.find(x => x.id === a.closest("[data-rid]").dataset.rid); if (r && coins() >= r.cost){ S.spent += r.cost; S.redeemed.push({text:r.text, cost:r.cost, ts:Date.now()}); save(); render(); toast("Disfruta: " + r.text + ". Te lo has ganado."); } break; }
    case "reward-add": { const t = $("#rw-text").value.trim(), c = parseInt($("#rw-cost").value)||50; if (!t) break; S.rewards.push({id:uid(), text:t, cost:c}); save(); render(); break; }
    case "reward-del": { const id = a.closest("[data-rid]").dataset.rid; S.rewards = S.rewards.filter(r => r.id !== id); save(); render(); break; }
    case "review-save": { S.reviews[monday()] = {good:$("#rv-good").value.trim(), bad:$("#rv-bad").value.trim(), next:$("#rv-next").value.trim(), ts:Date.now()}; gainXP(15, true); checkBadges(); save(); render(); toast("Revisión guardada. Semana nueva, cabeza clara."); break; }
    case "journal-save": {
      const nx = $("#j-next").value, today = dkey();
      S.journal[today] = {good:$("#j-good").value.trim(), next:nx, closed:true, ts:Date.now()};
      const ks = Object.keys(S.journal).sort(); while (ks.length > 120) delete S.journal[ks.shift()];
      if (nx){ const t = S.tasks.find(x => x.id === nx); if (t) t.plan = addDays(today,1); }
      save(); render(); toast("Día cerrado. Mañana ya sabes por dónde empezar."); break; }
    case "br-pattern": { const was = br.on; breathStop(); br.pattern = a.dataset.v; render(); if (was){ br.on = true; setTimeout(() => breathStep(0), 50); } break; }
    case "br-start": breathStop(); br.on = true; if (view !== "calma") go("calma"); else render(); $("#orb")?.scrollIntoView({block:"center", behavior:"smooth"}); setTimeout(() => breathStep(0), 60); br.end = setTimeout(() => { if (br.on){ breathStop(); if (view === "calma") render(); toast("Un minuto hecho. ¿Siguiente paso?"); } }, 64000); break;
    case "br-stop": breathStop(); render(); break;
    case "go-dump": noteKind = "descarga"; go("mente"); setTimeout(() => $("#note-text")?.focus(), 50); break;
    case "ten-min": breathStop(); startFocusOn(smallest() || null, 10); break;
    case "five-min": breathStop(); startFocusOn(smallest() || null, 5); toast("Solo 5 minutos. Si luego quieres seguir, genial."); break;
    case "ctl-add": { const v = $("#ctl-in").value.trim(); if (!v) break; S.control.push({id:uid(), text:v, v:a.dataset.v}); save(); render(); setTimeout(() => $("#ctl-in")?.focus()); break; }
    case "ctl-task": { const c = S.control.find(x => x.id === a.dataset.id); addTask({title:c.text}); S.control = S.control.filter(x => x !== c); save(); render(); toast("Convertido en tarea en Plan"); break; }
    case "ctl-drop": S.control = S.control.filter(x => x.id !== a.dataset.id); save(); render(); toast("Soltado. No era tuyo de cargar."); break;
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "t-subj"){ T.subjectId = t.value; const task = S.tasks.find(x => x.id === T.taskId); if (task && task.subjectId !== t.value) T.taskId = ""; saveTimer(); render(); }
  else if (t.id === "t-task"){ T.taskId = t.value; const task = S.tasks.find(x => x.id === t.value); if (task){ T.subjectId = task.subjectId || ""; if (!T.intention) T.intention = task.title; } saveTimer(); render(); }
  else if (t.id === "t-int"){ T.intention = t.value.trim(); saveTimer(); }
  else if (t.id === "auto-next"){ S.settings.autoNext = t.checked; save(); }
  else if (t.id === "s-file"){ const f = t.files && t.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restore(String(r.result)); r.readAsText(f); }
  else if (t.dataset.actChange === "plan-day"){ const task = S.tasks.find(x => x.id === t.closest("[data-id]").dataset.id); if (task && t.value){ task.plan = t.value; save(); render(); } }
  else if (t.dataset.field && t.closest("[data-sid]")){ const s = subj(t.closest("[data-sid]").dataset.sid); if (t.dataset.field === "name" && t.value.trim()) s.name = t.value.trim(); if (t.dataset.field === "ects") s.ects = parseInt(t.value)||0; if (t.dataset.field === "weekly") s.weekly = parseFloat(t.value)||0; save(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "vol"){ S.settings.vol = +t.value; if (audio.gain) audio.gain.gain.value = S.settings.vol; clearTimeout(t._s); t._s = setTimeout(save, 500); }
  else if (t.id === "note-q"){ noteQ = t.value; const pos = t.selectionStart; render(); const n = $("#note-q"); if (n){ n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener("keydown", e => {
  const id = e.target.id, typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.key === "Escape"){ if ($("#modal-root").innerHTML) closeModal(); else if (zen){ zen = false; renderZen(); render(); } return; }
  if (!typing && S.onboarded){
    if (view === "repasar" && rv){
      if (e.key === " " && !rv.show){ e.preventDefault(); rv.show = true; render(); return; }
      if (rv.show && "1234".includes(e.key)){ const b = document.querySelectorAll('[data-act="grade"]')[+e.key-1]; if (b) b.click(); return; }
    }
    if ((e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey && !$("#modal-root").innerHTML){ e.preventDefault(); openCapture(); return; }
  }
  if (e.key !== "Enter") return;
  if ((id === "note-text" || id === "cap-text") && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $(id === "note-text" ? '[data-act="add-note"]' : '[data-act="cap-save"]').click(); return; }
  const map = {"nt-title":"add-task", "park":"park", "chat-in":"chat-send", "new-subj":"subj-add", "ob-custom":"ob-add", "ctl-in":null, "rw-text":"reward-add", "et-title":"et-save", "cap-text":"cap-save"};
  if (id in map && map[id] && e.target.tagName === "INPUT") { e.preventDefault(); $(`[data-act="${map[id]}"]`)?.click(); }
  if (id === "t-int"){ e.preventDefault(); T.intention = e.target.value.trim(); saveTimer(); if (!T.running) $('[data-act="t-toggle"]').click(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && T.running) { keepAwake(true); if (timeLeft() <= 0) finishBlock(true); } });

if (!IN_CLAUDE && "serviceWorker" in navigator && location.protocol === "https:") { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e){} }
render();
connect();
})();
</script>
</body></html>
