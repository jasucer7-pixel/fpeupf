<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d55c8"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="description" content="Organiza el estudio, concéntrate y no te agobies. Para FPE en la UPF.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Segunda Mente FPE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — side rail on desktop, bottom tab bar on phones; one calm column of cards per view. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#eceef3; --ink:#161b26; --muted:#5a6273; --line:#dde1e8;
  --accent:#2d55c8; --accent-ink:#ffffff; --accent-soft:#e5ebfa;
  --ok:#157a3c; --ok-soft:#e1f3e7; --warn:#a85a06; --warn-soft:#fbefdc; --danger:#b42323; --danger-soft:#fbe4e4;
  --gold:#a8730a; --gold-soft:#f8eed3;
  --leaf:#3e8a4a; --leaf-2:#62a957; --trunk:#8a5a3b; --soil:#e3d8c6;
  --heat0:#e6e9ef; --heat1:#c3d0f3; --heat2:#8ea7ea; --heat3:#5277db; --heat4:#2d55c8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgb(20 30 60 / .06), 0 6px 20px rgb(20 30 60 / .05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#161a22; --surface-2:#1e2330; --ink:#e7eaf1; --muted:#99a2b4; --line:#2a3040;
  --accent:#86a2ff; --accent-ink:#0e1117; --accent-soft:#1d2849;
  --ok:#5bd28a; --ok-soft:#13291c; --warn:#f2b54a; --warn-soft:#2d2210; --danger:#f58a8a; --danger-soft:#331616;
  --gold:#f0c35a; --gold-soft:#2e2510;
  --leaf:#4fae5e; --leaf-2:#79c76f; --trunk:#a8774f; --soil:#3a3128;
  --heat0:#1e2330; --heat1:#25345f; --heat2:#3a5299; --heat3:#5c7ad6; --heat4:#86a2ff;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#161a22; --surface-2:#1e2330; --ink:#e7eaf1; --muted:#99a2b4; --line:#2a3040;
  --accent:#86a2ff; --accent-ink:#0e1117; --accent-soft:#1d2849;
  --ok:#5bd28a; --ok-soft:#13291c; --warn:#f2b54a; --warn-soft:#2d2210; --danger:#f58a8a; --danger-soft:#331616;
  --gold:#f0c35a; --gold-soft:#2e2510;
  --leaf:#4fae5e; --leaf-2:#79c76f; --trunk:#a8774f; --soil:#3a3128;
  --heat0:#1e2330; --heat1:#25345f; --heat2:#3a5299; --heat3:#5c7ad6; --heat4:#86a2ff;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.85rem;letter-spacing:-.01em} h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.rail{position:fixed;inset:auto 0 0 0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px, env(safe-area-inset-left,0px))}
.brand{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.72rem;font-weight:600;padding:6px 8px;border-radius:10px;min-width:56px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tab .badge{position:absolute;top:2px;right:10px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;border-radius:999px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.tab.desk{display:none}
.rail-foot{display:none}
main{padding-block:20px 110px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));min-width:0}
.view{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
@media (min-width:900px){
  .app{grid-template-columns:232px 1fr}
  .rail{position:sticky;top:0;inset:auto;height:100vh;flex-direction:column;justify-content:flex-start;gap:3px;border-top:0;border-right:1px solid var(--line);padding:22px 14px;overflow-y:auto}
  .brand{display:block;font-family:var(--f-display);font-weight:700;font-size:1.15rem;padding:4px 10px 16px;line-height:1.2}
  .brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.75rem;color:var(--muted);margin-top:4px}
  .tab{flex-direction:row;gap:10px;font-size:.92rem;padding:9px 12px;justify-content:flex-start}
  .tab svg{width:20px;height:20px}
  .tab.desk{display:flex} .tab.mob{display:none}
  .tab .badge{position:static;margin-left:auto}
  .rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
  .rail .rail-lvl{display:block}
  main{padding-block:36px 48px}
}
.rail-lvl{display:none;padding:12px;border-radius:12px;background:var(--surface-2);font-size:.8rem;margin-bottom:8px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top .meta{color:var(--muted);font-size:.85rem;font-weight:500;margin-bottom:4px;letter-spacing:.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card.quiet{background:transparent;box-shadow:none;border-style:dashed}
.card.hero{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:.85rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.lg{padding:12px 20px;font-size:1rem}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.danger{color:var(--danger)}
.icon-btn{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on{color:var(--warn)}
.icon-btn.solid{background:var(--accent);color:var(--accent-ink)}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0;flex:1}
label.chk{display:flex;gap:8px;align-items:center;font-size:.88rem;font-weight:500}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600;background:var(--surface);white-space:nowrap}
button.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pill{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.examen{background:var(--danger-soft);color:var(--danger)}
.pill.entrega{background:var(--warn-soft);color:var(--warn)}
.pill.lectura{background:var(--accent-soft);color:var(--accent)}
.pill.repaso{background:var(--ok-soft);color:var(--ok)}
.due{font-size:.78rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.due.late{color:var(--danger)} .due.soon{color:var(--warn)} .due.ok{color:var(--muted)}
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);min-width:0}
.task:first-child{border-top:0}
.task .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.task .t{font-weight:500;overflow-wrap:anywhere;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.task .t:hover{color:var(--accent)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.task .acts{display:flex;gap:0;flex:none}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.check svg{width:14px;height:14px}
.group-h{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 0 2px}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.quote{font-family:var(--f-display);font-weight:500;font-size:1.12rem;line-height:1.35}
.quote cite{display:block;font-family:var(--f-body);font-style:normal;font-size:.82rem;color:var(--muted);margin-top:6px}
.energy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.energy button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:.85rem}
.energy button span{font-size:.72rem;font-weight:500;color:var(--muted);text-align:center}
.energy button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;max-width:28px;border-radius:6px 6px 3px 3px;background:var(--accent);min-height:3px;opacity:.85}
.bar.zero i{background:var(--line)}
.bar.today i{opacity:1}
.bar b{font-size:.7rem;color:var(--muted);font-weight:600}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat .n{font-family:var(--f-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{font-size:.78rem;color:var(--muted)}
/* hero goal */
.goal{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.goal-ring{position:relative;width:104px;height:104px;flex:none}
.goal-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal-ring circle{fill:none;stroke-width:10}
.goal-ring .trk{stroke:var(--surface-2)} .goal-ring .prg{stroke:var(--accent);stroke-linecap:round}
.goal-ring.met .prg{stroke:var(--ok)}
.goal-ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.goal-ring .c b{font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.goal-ring .c span{font-size:.7rem;color:var(--muted)}
.goal .info{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px}
.why{font-family:var(--f-display);font-weight:500;font-size:1rem;line-height:1.3}
.xpbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:999px}
.coin{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.coin::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-soft)}
/* focus */
.timer-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0}
.ring{position:relative;width:min(280px,72vw);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .trk{stroke:var(--surface-2)}
.ring .prg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s linear}
.ring.brk .prg{stroke:var(--ok)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:0 24px}
.ring .time{font-family:var(--f-mono);font-size:clamp(2.4rem,11vw,3.4rem);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .mode{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.counter{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem}
.counter b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.zen{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px max(16px, env(safe-area-inset-right,0px)) 24px max(16px, env(safe-area-inset-left,0px));text-align:center}
.zen .time{font-family:var(--f-mono);font-size:clamp(4rem,20vw,9rem);font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.zen .int{font-family:var(--f-display);font-size:1.3rem;max-width:30ch}
/* notes */
.note{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:6px}
.note:first-child{border-top:0}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.note .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.pill.idea{background:var(--accent-soft);color:var(--accent)}
.pill.duda{background:var(--warn-soft);color:var(--warn)}
.pill.descarga{background:var(--surface-2);color:var(--muted)}
.pill.apunte{background:var(--ok-soft);color:var(--ok)}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
/* calm */
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.orb{width:180px;height:180px;max-width:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%, var(--accent-soft), var(--surface-2));border:1px solid var(--line);transform:scale(.62);transition:transform 4s ease-in-out}
.orb span{font-family:var(--f-display);font-weight:700;font-size:1.05rem;color:var(--ink);transform:scale(1.4)}
.steps{display:flex;flex-direction:column;gap:10px;counter-reset:s}
.step{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);flex-wrap:wrap}
.step::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:700;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.step .body{flex:1;min-width:160px}
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:560px){.cols{grid-template-columns:1fr 1fr}}
.col{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.col li{overflow-wrap:anywhere}
.col ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
/* week */
.week{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:760px){.week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}}
.day{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:60px}
.day.today{outline:2px solid var(--accent);background:var(--accent-soft)}
.day h3{font-size:.85rem;display:flex;justify-content:space-between;gap:4px}
.day h3 span{color:var(--muted);font-family:var(--f-body);font-weight:600;font-size:.75rem}
.wt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.8rem;display:flex;gap:6px;align-items:flex-start;min-width:0}
.wt span:not(.dot){overflow-wrap:anywhere;flex:1;min-width:0}
.wt.done span{text-decoration:line-through;color:var(--muted)}
.wt.dl{border-style:dashed}
.wt .dot{margin-top:5px}
/* exams */
.exams{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.exam{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);min-width:0}
.exam .big{font-family:var(--f-display);font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.exam .big small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:4px}
/* timetable */
.tt{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:.88rem;min-width:0}
.slot .h{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.slot .n{flex:1;min-width:0;overflow-wrap:anywhere}
/* flashcards */
.fcard{border:1px solid var(--line);border-radius:16px;padding:28px 22px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;background:var(--surface);box-shadow:var(--shadow)}
.fcard .q{font-family:var(--f-display);font-size:1.3rem;font-weight:500;line-height:1.3;overflow-wrap:anywhere;white-space:pre-wrap}
.fcard .a{font-size:1.02rem;white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:16px;width:100%}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.grades button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-weight:600;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.grades button span{font-size:.7rem;color:var(--muted);font-weight:500}

  ["checkins","journal","reviews","badges","goalDays","deleted","habitLog","challenges","reviewLog","topicUps","frozen"].forEach(k => { if (!s[k] || typeof s[k] !== "object" || Array.isArray(s[k])) s[k] = {}; });

    s.tasks.forEach(t => { if (t.today && !t.done) t.plan = dkey(); delete t.today; });

  let xp = S.xp, n = 1;
  while (xp >= lvlNeed(n)) { xp -= lvlNeed(n); n++; }
  return {n, into:xp, need:lvlNeed(n), title:LEVELS[Math.min(n-1, LEVELS.length-1)]};
}

  return "Entre trimestres";

function dueInfo(due){
  if (!due) return null;
  const n = daysBetween(new Date(), parseD(due));
  let txt, cls;
  if (n < 0) { txt = n === -1 ? "ayer" : "hace " + (-n) + " días"; cls = "late"; }
  else if (n === 0) { txt = "hoy"; cls = "late"; }
  else if (n === 1) { txt = "mañana"; cls = "soon"; }
  else if (n <= 6) { txt = "en " + n + " días"; cls = "soon"; }
  else { txt = shortDate(due); cls = "ok"; }
  return {n, txt, cls};
}

let wake = null;
async function keepAwake(on){
  try { if (on && "wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } else if (!on && wake) { await wake.release(); wake = null; } } catch(e){ wake = null; }
}
let actx = null;
function ctx(){ if (!actx) { try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } if (actx && actx.state === "suspended") actx.resume(); return actx; }
function chime(){
  const A = ctx(); if (!A) return;
  [660, 880, 990].forEach((f,i) => { const o = A.createOscillator(), g = A.createGain(); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0.0001, A.currentTime + i*.18); g.gain.exponentialRampToValueAtTime(0.2, A.currentTime + i*.18 + .02); g.gain.exponentialRampToValueAtTime(0.0001, A.currentTime + i*.18 + .6); o.connect(g).connect(A.destination); o.start(A.currentTime + i*.18); o.stop(A.currentTime + i*.18 + .65); });
}
const audio = {kind:"", src:null, gain:null};
function setAmbient(kind){
  if (audio.src){ try { audio.src.stop(); } catch(e){} audio.src = null; }
  audio.kind = kind || "";
  if (!kind) return;
  const A = ctx(); if (!A) return;
  const len = A.sampleRate * 6, buf = A.createBuffer(1, len, A.sampleRate), d = buf.getChannelData(0);
  let last = 0, b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random()*2 - 1;
    if (kind === "marron"){ last = (last + 0.02*w) / 1.02; d[i] = last * 3.2; }
    else if (kind === "lluvia"){ b0 = 0.99765*b0 + w*0.099046; b1 = 0.963*b1 + w*0.2965164; b2 = 0.57*b2 + w*1.0526913; d[i] = (b0 + b1 + b2 + w*0.1848) * 0.09; }
    else d[i] = w * 0.18;
  }
  // crossfade loop edges to avoid a click
  const f = Math.floor(A.sampleRate*0.3); for (let i = 0; i < f; i++){ const k = i/f; d[i] = d[i]*k + d[len-f+i]*(1-k); }
  const src = A.createBufferSource(); src.buffer = buf; src.loop = true; src.loopEnd = (len - f)/A.sampleRate;
  const g = A.createGain(); g.gain.value = S.settings.vol;
  let node = src;
  if (kind === "lluvia"){ const hp = A.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 500; node.connect(hp); node = hp; }
  node.connect(g).connect(A.destination); src.start();
  audio.src = src; audio.gain = g;
}

}

function startRunning(){ T.running = true; T.endAt = Date.now() + T.left*1000; saveTimer(); keepAwake(true); }
let lastSession = null;
function finishBlock(auto){
  if (T.mode === "focus"){
    const min = auto ? Math.round(T.total/60) : Math.floor((T.total - timeLeft())/60);
    if (min >= 1){
      lastSession = {id:uid(), subjectId:T.subjectId||"", taskId:T.taskId||"", min, ts:Date.now(), intention:T.intention||"", distractions:T.distractions||0, exits:T.exits||0};
      S.sessions.push(lastSession); gainXP(min); trim(); checkGoal(); checkBadges(); save();
      T.cycles++; T.cyclesDay = dkey();
      setMode(T.cycles % (S.settings.longEvery||4) === 0 ? "long" : "break");
      if (advanceQueue()) setTimeout(() => toast("En la pausa. Siguiente bloque: " + clip(T.intention || "bloque libre", 40)), 3200);
      if (auto) { chime(); notify("Bloque terminado", "Te has ganado la pausa."); }
      if (S.settings.autoNext) startRunning();
      openRating(min);
    } else { setMode("focus"); toast("Bloque demasiado corto para contarlo."); }
  } else {
    setMode("focus");
    if (auto) { chime(); notify("Pausa terminada", "¿Otro bloque?"); }
    if (S.settings.autoNext) startRunning();
    toast("Pausa terminada. ¿Otro bloque?");
  }
  if (!T.running) keepAwake(false);
  if (view === "foco") render();
  if (zen) renderZen();
}
function openRating(min){

  $("#modal-root").innerHTML = `<div class="modal"><div class="card" role="dialog" aria-modal="true" aria-label="Bloque terminado">

    <h2>${BLOCK_CHEERS[Math.floor(Math.random()*BLOCK_CHEERS.length)]}</h2>

    ${(() => { const lt = lastSession && S.tasks.find(x => x.id === lastSession.taskId && !x.done); return lt ? `<button class="btn sm" data-act="rate-done" data-id="${lt.id}" style="align-self:flex-start">${ICON.check} He terminado «${esc(clip(lt.title, 30))}»</button>` : ""; })()}
    <p class="small muted">¿Qué tal la concentración?</p>
    <div class="energy">${[[1,"Dispersa","me ha costado"],[2,"Normal","bien"],[3,"Profunda","en la zona"]].map(([v,l,s]) => `<button data-act="rate" data-v="${v}">${l}<span>${s}</span></button>`).join("")}</div>
    <p class="small muted">En la pausa: levántate, estira, agua. Nada de redes, que te roban la pausa.</p>
  </div></div>`;
}
setInterval(() => {
  if (!T.running) return;
  if (timeLeft() <= 0) { finishBlock(true); return; }
  if (view === "foco" || zen) paintTimer(); else document.title = fmt(timeLeft()) + (T.mode==="focus" ? " · Foco" : " · Pausa");
}, 1000);

function schedule(c, q, dry){
  c.ease = c.ease || 2.5; c.reps = c.reps || 0; c.interval = c.interval || 0;
  let iv;
  if (q === 0){ c.reps = 0; iv = 0; c.ease = Math.max(1.3, c.ease - 0.2); }
  else {
    if (c.reps === 0) iv = q === 1 ? 1 : q === 2 ? 1 : 3;
    else if (c.reps === 1) iv = q === 1 ? 2 : q === 2 ? 3 : 5;
    else iv = Math.max(c.interval + 1, Math.round(c.interval * (q === 1 ? 1.2 : q === 2 ? c.ease : c.ease * 1.3)));
    c.ease = Math.max(1.3, c.ease + (q === 1 ? -0.15 : q === 3 ? 0.15 : 0));
    c.reps++;
  }
  if (dry) return iv;
  c.interval = iv; c.due = addDays(dkey(), iv); c.seen = (c.seen||0) + 1;
  return iv;
}

  return {ev, tw, gw, avg: gw ? pts/gw : null, acc: tw ? pts/tw : 0, target, remW, need: remW > 0 ? (target*tw - pts)/remW : null, final: remW <= 0 && tw ? pts/tw : null,

function weekStats(){

  return {days:new Set(ses.map(s => dkey(new Date(s.ts)))).size, min:ses.reduce((a,s) => a + s.min, 0), goals:wk.filter(k => S.goalDays[k]).length,

function weekChallenges(){

  if (!out || out.length < 3){

    const pool = CH_POOL.filter(c => (c[0] !== "hab4" || S.habits.length) && (c[0] !== "topics3" || S.topics.length) && (c[0] !== "cards40" || S.cards.length >= 10));
    out = [];
    while (out.length < 3 && pool.length){ h = (Math.imul(h, 1103515245) + 12345) >>> 0; out.push(pool.splice(h % pool.length, 1)[0]); }
    S.challenges[m] = Object.assign({}, S.challenges[m], {_set: out.map(c => c[0]).join(",")});
  }
  const ws = weekStats(), claimed = S.challenges[m] || {};
  return out.map(([id, name, goal, reward, key]) => ({id, name, goal, reward, val:Math.min(goal, ws[key]), raw:ws[key], claimed:!!claimed[id], fmt:key === "min" ? fmtMin : (x => x)}));
}

const LS_BK = "segunda-mente-backups";

function restoreState(obj){
  const cur = S, next = migrate(obj), now = Date.now();
  const del = Object.assign({}, cur.deleted||{}, next.deleted||{});
  // items brought back win over their tombstones on every synced device
  ARR_KEYS.forEach(k => (next[k]||[]).forEach(x => { if (x && x.id && del[x.id]){ x._r = now; delete del[x.id]; } }));
  next.deleted = del; next.onboarded = next.onboarded || cur.onboarded;
  S = next; known = idSet(cur);
  save(); render();
}
function doUndo(){

  restoreState(snap); $("#toast").hidden = true; toast("Recuperado");
}

let apPreview = null;
function autoPlan(){
  const today = dkey(), H = 14, cap = S.settings.dayCap || S.settings.dailyGoal, rest = +S.settings.restDay;
  const late = new Date().getHours() >= 21;
  const days = [...Array(H)].map((_,i) => addDays(today, i)).filter(k => !(late && k === today));
  const load = {}; days.forEach(k => load[k] = S.tasks.filter(t => !t.done && t.plan === k).reduce((a,t) => a + (t.est||45), 0));
  const todo = S.tasks.filter(t => !t.done && !t.plan && t.type !== "examen").sort((a,b) => byDue(a,b) || (b.est||45) - (a.est||45));
  const out = [];
  todo.forEach(t => {
    const est = t.est || 45;
    let last = t.due ? addDays(t.due, t.type === "entrega" ? -1 : 0) : days[days.length-1];
    if (last < days[0]) last = days[0];
    let cand = days.filter(k => k <= last && (parseD(k).getDay() !== rest || k === last));
    if (!cand.length) cand = [days[0]];
    const k = cand.find(d => load[d] + est <= cap) || cand.slice().sort((x,y) => load[x] - load[y])[0];
    load[k] += est; out.push({id:t.id, day:k});
  });
  return {out, load, cap};
}

    ${keys.some(k => apPreview.load[k] > apPreview.cap) ? `<p class="small" style="color:var(--warn)">Algunos días quedan cargados porque las fechas no dan más margen. Si puedes, trocea tareas o empieza antes.</p>` : ""}

function celebrate(){

  document.body.appendChild(c);

  const cols = [...COLORS, "#f0c35a"];
  const P = [...Array(110)].map(() => ({x: W/2 + (Math.random()-.5)*W*.3, y: H*.35, vx:(Math.random()-.5)*16*devicePixelRatio, vy:(-Math.random()*16 - 6)*devicePixelRatio, r:(4 + Math.random()*5)*devicePixelRatio, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, s:(Math.random()-.5)*.3}));
  const t0 = performance.now();
  (function frame(t){
    const el = t - t0; x.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .55*devicePixelRatio; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = Math.max(0, 1 - el/1900); x.fillStyle = p.c; x.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); x.restore(); });
    if (el < 1900) requestAnimationFrame(frame); else c.remove();
  })(t0);
}

function lastWeekSummary(){
  const m = monday(), lm = addDays(m, -7), st = parseD(lm).getTime(), en = parseD(m).getTime();
  const ses = S.sessions.filter(s => s.ts >= st && s.ts < en);
  if (!ses.length) return null;
  const min = ses.reduce((a,s) => a + s.min, 0), days = new Set(ses.map(s => dkey(new Date(s.ts)))).size;
  const tasks = S.tasks.filter(t => t.done && t.doneAt >= st && t.doneAt < en).length;
  const per = {}; ses.forEach(s => per[s.subjectId||""] = (per[s.subjectId||""]||0) + s.min);
  const top = Object.entries(per).sort((a,b) => b[1] - a[1])[0];
  const pst = parseD(addDays(lm, -7)).getTime(), pmin = S.sessions.filter(s => s.ts >= pst && s.ts < st).reduce((a,s) => a + s.min, 0);
  return {min, days, tasks, blocks:ses.length, top:top ? subjName(top[0]) : "", diff: min - pmin, hadPrev: pmin > 0};
}
function weekSummaryHtml(){
  const w = lastWeekSummary();
  if (!w) return `La semana pasada no registraste bloques. Esta semana empieza de cero: un bloque hoy ya cambia la tendencia.`;

}

/* ================= SYNC (GitHub Gist, web only) ================= */
const LS_SYNC = "segunda-mente-sync", GIST_FILE = "segunda-mente.json";
let sync = {}; try { sync = JSON.parse(localStorage.getItem(LS_SYNC)) || {}; } catch(e){}
let syncBusy = false, syncAgain = false, syncErr = "", syncT = null;
const saveSyncCfg = () => { try { localStorage.setItem(LS_SYNC, JSON.stringify(sync)); } catch(e){} };
async function gh(path, opts={}){
  const r = await fetch("https://api.github.com" + path, Object.assign({cache:"no-store"}, opts, {headers:{Authorization:"Bearer " + sync.token, Accept:"application/vnd.github+json", "Content-Type":"application/json"}}));
  if (!r.ok) throw {status:r.status};
  return r.json();
}
const ARR_KEYS = ["subjects","tasks","notes","sessions","cards","timetable","rewards","control","topics","evals","links","habits","readings"];
const OBJ_KEYS = ["checkins","journal","reviews","badges","goalDays","habitLog","challenges","reviewLog","topicUps","frozen"];
function mergeStates(a, b){
  const newer = (b.updated||0) > (a.updated||0) ? b : a, older = newer === a ? b : a;
  const out = JSON.parse(JSON.stringify(newer));
  const del = Object.assign({}, older.deleted||{}, newer.deleted||{});
  const cutoff = Date.now() - 120*864e5; Object.keys(del).forEach(k => { if (del[k] < cutoff) delete del[k]; });
  out.deleted = del;
  ARR_KEYS.forEach(k => {
    const seen = new Set(), res = [];
    const alive = x => x && (!del[x.id] || (x._r && x._r > del[x.id]));
    (newer[k]||[]).forEach(x => { if (alive(x)) { seen.add(x.id); res.push(x); } });
    (older[k]||[]).forEach(x => { if (x && !seen.has(x.id) && alive(x)) { seen.add(x.id); res.push(JSON.parse(JSON.stringify(x))); } });
    res.forEach(x => { if (del[x.id]) delete del[x.id]; });
    out[k] = k === "sessions" ? res.sort((p,q) => p.ts - q.ts) : res;
  });
  OBJ_KEYS.forEach(k => { out[k] = Object.assign({}, older[k]||{}, newer[k]||{}); });
  const red = new Map(); [...(older.redeemed||[]), ...(newer.redeemed||[])].forEach(r => red.set(r.ts + r.text, r)); out.redeemed = [...red.values()].sort((p,q) => p.ts - q.ts);
  out.xp = Math.max(a.xp||0, b.xp||0); out.spent = Math.max(a.spent||0, b.spent||0); out.dumps = Math.max(a.dumps||0, b.dumps||0); out.freezes = newer.freezes||0;
  out.onboarded = !!(a.onboarded || b.onboarded);
  out.updated = Math.max(a.updated||0, b.updated||0);
  return out;
}
function applyState(next){
  S = migrate(next); known = idSet(S);
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
  const act = document.activeElement;
  if (!(act && /INPUT|TEXTAREA|SELECT/.test(act.tagName) && $("#view").contains(act))) render();
}
async function gistSync(){
  if (!sync.token || !sync.gistId) return;
  if (syncBusy){ syncAgain = true; return; }
  syncBusy = true;
  try {
    const g = await gh("/gists/" + sync.gistId);
    const f = g.files && g.files[GIST_FILE];
    let remote = null;
    if (f) remote = JSON.parse(f.truncated ? await (await fetch(f.raw_url, {cache:"no-store"})).text() : f.content);
    const merged = remote ? mergeStates(S, remote) : S;
    const mergedTxt = JSON.stringify(merged);
    if (!remote || mergedTxt !== JSON.stringify(remote)) await gh("/gists/" + sync.gistId, {method:"PATCH", body:JSON.stringify({files:{[GIST_FILE]:{content:mergedTxt}}})});
    if (mergedTxt !== JSON.stringify(S)) applyState(merged);
    sync.last = Date.now(); syncErr = ""; saveSyncCfg();
  } catch(e){
    syncErr = e && e.status === 401 ? "El token ya no es válido. Crea otro y vuelve a conectar." : e && e.status === 404 ? "No encuentro el gist de sincronización. Vuelve a conectar." : "Sin conexión: se sincronizará cuando vuelva internet.";
  }
  syncBusy = false; paintSync();
  document.querySelectorAll(".sync-chip").forEach(c => { c.className = "sync-chip" + (sync.gistId && !syncErr ? " on" : ""); c.innerHTML = "<i></i>" + syncStatusText(); });
  if (syncAgain){ syncAgain = false; setTimeout(gistSync, 500); }
}
async function gistConnect(token){
  sync = {token:token.trim()}; syncErr = "";
  try {
    const list = await gh("/gists?per_page=100");
    const found = list.find(g => g.files && g.files[GIST_FILE] && /Segunda Mente/.test(g.description||""));
    if (found) sync.gistId = found.id;
    else {
      const g = await gh("/gists", {method:"POST", body:JSON.stringify({description:"Segunda Mente FPE: datos sincronizados (privado)", public:false, files:{[GIST_FILE]:{content:JSON.stringify(S)}}})});
      sync.gistId = g.id;
    }
    saveSyncCfg(); await gistSync(); syncInit();
    toast(found ? "Vinculado. Tus datos ya son los mismos que en tus otros dispositivos." : "Sincronización activada. Ahora escanea el QR con el móvil.");
    if (!found){ render(); openSyncWizard(); return; }
  } catch(e){
    sync = {}; saveSyncCfg();
    toast(e && e.status === 401 ? "Token no válido. Revisa que lo has copiado entero." : e && e.status === 403 ? "Al token le falta el permiso «gist»." : "No he podido conectar con GitHub. Prueba de nuevo.");
  }
  if ($("#modal-root").innerHTML) openSyncWizard();
  render();
}
function scheduleGist(){ if (sync.gistId){ clearTimeout(syncT); syncT = setTimeout(gistSync, 2500); } }
let syncLoop = false;
function syncInit(){
  if (IN_CLAUDE || !sync.gistId || syncLoop) return;
  syncLoop = true;
  gistSync();
  setInterval(() => { if (!document.hidden) gistSync(); }, 60000);
  window.addEventListener("focus", () => gistSync());
  document.addEventListener("visibilitychange", () => { if (!document.hidden) gistSync(); });
  window.addEventListener("online", gistSync);

  if (!/^[A-Za-z0-9_]{20,}$/.test(token)){ toast("El enlace de vinculación no es válido."); return; }
  if (sync.token === token && sync.gistId) { toast("Este dispositivo ya estaba vinculado."); return; }
  toast("Vinculando con tus otros dispositivos…");
  gistConnect(token);
}

function coachBrief(){

function detectIntent(n){
  let best = null, bs = 0;
  const boost = {phone:6, examanx:4, agobio:3, fail:2};
  INTENTS.forEach(([id, kws]) => { let sc = 0; kws.forEach(k => { if (n.includes(k)) sc += k.length; }); if (sc) sc += boost[id]||0; if (sc > bs){ bs = sc; best = id; } });
  return best;
}
function parseDate(n){
  const today = dkey();
  if (/pasado manana/.test(n)) return addDays(today, 2);
  if (/\bmanana\b/.test(n)) return addDays(today, 1);
  if (/\bhoy\b/.test(n)) return today;
  if (/semana que viene|proxima semana/.test(n)) return addDays(today, 7);
  let m = n.match(/en (\d{1,2}) dias?/); if (m) return addDays(today, +m[1]);
  const days = ["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
  for (let i = 0; i < 7; i++){ if (new RegExp("\\b" + days[i] + "\\b").test(n)){ let diff = (i - new Date().getDay() + 7) % 7; if (diff === 0) diff = 7; return addDays(today, diff); } }
  m = n.match(/\b(\d{1,2})[\/\-](\d{1,2})\b/);
  if (m){ const y = new Date().getFullYear(); let k = y + "-" + pad(+m[2]) + "-" + pad(+m[1]); if (k < today) k = (y+1) + "-" + pad(+m[2]) + "-" + pad(+m[1]); return k; }
  m = n.match(/\bel (?:dia )?(\d{1,2})\b(?! ?min)/);
  if (m){ const d = new Date(); let x = new Date(d.getFullYear(), d.getMonth(), +m[1]); if (dkey(x) < today) x = new Date(d.getFullYear(), d.getMonth()+1, +m[1]); return dkey(x); }
  return "";
}
function findSubject(n){
  let best = null, bs = 0;
  S.subjects.forEach(s => {
    const sn = norm(s.name);
    if (n.includes(sn)){ if (sn.length > bs){ bs = sn.length; best = s; } return; }
    sn.split(" ").filter(w => w.length > 4).forEach(w => { if (n.includes(w) && w.length > bs){ bs = w.length; best = s; } });
    if (/matem/.test(sn) && /\bmates\b/.test(n) && bs < 5){ bs = 5; best = s; }
  });
  return best;
}
function cleanTitle(raw){
  let t = raw.replace(/^\s*(a[nñ]ade|agrega|crea|apunta|anota|recu[eé]rdame|ap[uú]ntame|pon|guarda)( que)?\s+/i, "");
  t = t.replace(/\b(para |el |este |pr[oó]ximo |la )*(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)( que viene)?\b/gi, "")
       .replace(/\b(para )?(pasado )?ma[nñ]ana\b/gi, "").replace(/\b(para )?hoy\b/gi, "")
       .replace(/\b(para )?(el )?(d[ií]a )?\d{1,2}[\/\-]\d{1,2}\b/gi, "").replace(/\b(para )?el (d[ií]a )?\d{1,2}\b/gi, "")
       .replace(/\ben \d{1,2} d[ií]as?\b/gi, "").replace(/\b(para )?(la )?(semana que viene|pr[oó]xima semana)\b/gi, "")
       .replace(/^\s*(una |un |la |el )?(tarea|nota|idea|duda|recordatorio)( de| para| que| sobre)?:?\s*/i, "")
       .replace(/\s+(de|para|el|la)\s*$/i, "").replace(/\s+/g, " ").trim();
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : "";
}
function commandAdd(raw, n){

    const kind = /\bduda\b/.test(n) ? "duda" : /\bidea\b/.test(n) ? "idea" : "apunte";
    const text = cleanTitle(raw); if (!text) return {html:"¿Qué quieres que apunte? Escríbelo así: <i>apunta una duda: por qué el equilibrio de Nash no es eficiente</i>."};
    S.notes.push({id:uid(), kind, text, subjectId:sub?.id||"", ts:Date.now()}); save();
    return {html:`Apuntado en Mente como <b>${KINDS[kind].toLowerCase()}</b>${sub?` de ${esc(sub.name)}`:""}: «${esc(text)}».`, acts:[["Ver en Mente","go","mente"]]};

  if (type === "examen") title = sub ? (/parcial/i.test(title) ? "Parcial" : "Examen") + " de " + sub.name : (/examen|parcial/i.test(title) ? title : "Examen" + (title ? " " + title : ""));

  const t = addTask({title, subjectId:sub?.id||"", type, due:date, plan:date === dkey() ? date : ""});

  const acts = [["Ver en Plan","go","plan"]];
  if (type === "examen" && date) acts.unshift(["Crear plan de repaso","exam-plan",t.id]);
  if (type !== "examen") acts.unshift(["Hacerla hoy","today",t.id]);
  return {html:`Hecho: he añadido <b>«${esc(title)}»</b>${sub?` (${esc(sub.name)})`:""}${date?` para <b>${whenTxt(date)}</b>`:" sin fecha"}.${!sub && S.subjects.length ? " No he reconocido la asignatura; puedes cambiarla tocando la tarea en Plan." : ""}`, acts};
}

    const what = t ? esc(t.title) : ex ? "Repaso para «" + esc(ex.title) + "»" : weakestSubject() ? "Estudio de " + esc(weakestSubject().name) : "Lo que tengas más pendiente";
    rows.push(`<li><b>${hm(s)}–${hm(d)}</b> · ${what}</li>`);
    if (i < blocks-1){ const pb = (i+1) % (S.settings.longEvery||4) === 0 ? S.settings.longBrk : b; const s2 = new Date(d); d.setMinutes(d.getMinutes() + pb); rows.push(`<li class="muted">${hm(s2)}–${hm(d)} · pausa${pb > b ? " larga" : ""}: muévete, agua, nada de redes</li>`); }
  }
  if (d.getHours() >= 23 || d.getDate() !== new Date().getDate()) return `Es tarde para un plan largo. Hoy mejor un solo bloque corto y a dormir: dormir bien consolida lo que has estudiado.`;
  return `${ck?.energy === "baja" ? "Con energía baja, plan corto:" : "Tu plan para lo que queda de hoy:"}<ul>${rows.join("")}</ul>${pool.length ? "" : "No tienes tareas para hoy; añade alguna en Plan o dime «añade…». "}Termina a las ${hm(d)}. Si algo no sale, se pasa a mañana sin drama.`;
}
function coachReply(raw){
  const n = norm(raw), nm = firstName();
  const ex = nextExam(), nt = nextTask(), m = minutesOn(dkey()), g = S.settings.dailyGoal, st = streak(), lv = level();
  const startAct = nt ? ["Empezar con «" + clip(nt.title, 24) + "»", "focus", nt.id] : ["Empezar un bloque", "focus", ""];
  // commands
  if (/^(a[nñ]ade|anade|agrega|crea|apunta|anota|recuerdame|apuntame|guarda)\b/.test(n) || /^pon(me)? (un |una )?(tarea|examen|entrega|recordatorio)/.test(n)) return commandAdd(raw, n);
  if (/(empieza|empezar|empecemos|inicia|iniciar|arranca|ponme|pon|comenzar|comienza|vamos a)\b.*\b(foco|bloque|pomodoro|temporizador|cronometro|a estudiar|estudiar)\b/.test(n)){
    const mm = n.match(/(\d{1,3}) ?(min|minutos|m\b)?/); const mins = mm ? Math.min(180, Math.max(1, +mm[1])) : S.settings.focus;
    return {html:`Vamos: bloque de <b>${mins} min</b>${nt ? ` con «${esc(nt.title)}»` : ""}. Móvil lejos.`, acts:[["Empezar ahora","focus",(nt?nt.id:"") + "|" + mins]]};
  }
  if (/\b(respira|respirar|respiracion)\b/.test(n)) return {html:"Buena idea. Un minuto de respiración en caja (4 segundos inhalar, 4 mantener, 4 exhalar, 4 mantener) baja las pulsaciones.", acts:[["Respirar 1 minuto","breath",""]]};
  if (/\b(repasar|repaso|tarjetas|flashcards?)\b/.test(n) && !/examen/.test(n)){ const dc = dueCards().length; return {html: dc ? `Tienes <b>${dc}</b> tarjeta${dc>1?"s":""} para hoy. Intenta responder antes de girarlas: equivocarte ahora es lo que fija el recuerdo.` : `No tienes tarjetas pendientes hoy. Crea algunas con los conceptos clave del último tema: el repaso activo es la técnica que más rinde.`, acts:[[dc?"Repasar ahora":"Crear tarjetas", dc?"review":"go", dc?"":"repasar"]]}; }
  // concept questions take priority when phrased as a question
  const askConcept = /\b(que es|que son|que significa|explica|explicame|define|definicion|quien es|quien fue|que fue|que dice|resume|hablame de|que opina|en que consiste|teoria de)\b/.test(n);
  const c = findConcept(raw);
  if (c && (askConcept || n.split(" ").length <= 4)) return conceptReply(c);
  const intent = detectIntent(n);
  const R = INTENT_REPLIES[intent];
  if (R) return R({n, raw, nm, ex, nt, m, g, st, lv, startAct});
  if (c) return conceptReply(c);
  const q = raw.trim().slice(0, 120);
  return {html:`No tengo una respuesta exacta para eso: soy un coach sin IA y sé de estudio, motivación, tus datos y los conceptos básicos de tus asignaturas. Puedes:<ul><li>Buscarlo en <a href="https://es.wikipedia.org/w/index.php?search=${encodeURIComponent(q)}" target="_blank" rel="noopener">Wikipedia</a> o en tus apuntes.</li><li>Guardarlo como duda y preguntarlo en clase o en tutoría.</li></ul>Prueba también con «qué hago ahora», «plan para hoy», «estoy agobiado» o «explícame el óptimo de Pareto».`, acts:[["Guardar como duda","duda",q]]};
}
function conceptReply(c){
  const rel = KB_N.filter(x => x !== c && x.area === c.area).slice(0, 3);
  return {html:`<b>${esc(c.t)}</b> <span class="muted">· ${esc(c.area)}</span><br>${esc(c.d)}<br><span class="muted small">Para fijarlo: explícalo con tus palabras en voz alta como si se lo contaras a alguien de primero (técnica Feynman).</span>${rel.length ? `<br><span class="small muted">Relacionado: ${rel.map(r => esc(r.t)).join(" · ")}</span>`:""}`, acts:[["Crear tarjeta","card",c.t]]};
}
const INTENT_REPLIES = {
  who: () => ({html:`Soy tu coach de estudio. No uso IA, pero conozco tus tareas, exámenes, horas y racha, y sé bastante de técnicas de estudio y de tus asignaturas. Puedes pedirme:<ul><li><b>Órdenes</b>: «añade examen de Matemáticas el jueves», «apunta una duda: …», «empieza un bloque de 50 min».</li><li><b>Guía</b>: «cómo se usa la app», «resumen de la semana pasada».</li><li><b>Organización</b>: «qué hago ahora», «plan para hoy», «organízame la semana», «cómo voy», «qué nota necesito», «cómo llevo el temario», «mis retos», «mis hábitos».</li><li><b>Ánimo</b>: «estoy agobiado», «no tengo ganas», «me distraigo con el móvil», «tengo miedo al examen».</li><li><b>Estudio</b>: «cómo estudio Derecho Constitucional», «cómo hago un comentario de texto», «explícame el velo de ignorancia».</li></ul>`}),

    if (x.nt) return {html:`Empieza por <b>«${esc(x.nt.title)}»</b>${x.nt.due ? `, que vence ${whenTxt(x.nt.due)}` : ""}. Solo un bloque; luego decides. Antes de empezar, escribe qué quieres tener hecho al final del bloque.`, acts:[x.startAct]};
    const w = weakestSubject();

  plantoday: () => ({html: planTodayHtml(), acts:[["Empezar el primer bloque","focus",(nextTask()?.id||"")]]}),

  exam: (x) => {

  },
  examanx: () => ({html:`Los nervios antes de un examen son normales: tu cuerpo se prepara para rendir. Para que no te bloqueen:<ul><li>Practica en condiciones de examen (cronometrado, sin apuntes): lo conocido asusta menos.</li><li>Escribe 10 minutos lo que te preocupa antes del examen; está comprobado que reduce la ansiedad.</li><li>En el examen, empieza por la pregunta que mejor sabes. Si te quedas en blanco, respira, escribe palabras clave del tema y el hilo vuelve.</li></ul>Lo que depende de ti es prepararte; la nota exacta no.`, acts:[["Respirar 1 minuto","breath",""],["Escribir lo que me preocupa","dump",""]]}),
  agobio: (x) => ({html:`${x.nm ? esc(x.nm) + ", p" : "P"}ara un momento. No tienes que resolverlo todo hoy, solo lo siguiente. Haz esto:<ul><li>1 minuto de respiración.</li><li>Saca todo de la cabeza en una descarga mental, una cosa por línea.</li><li>Elige la tarea más pequeña y haz solo 10 minutos.</li></ul>El agobio viene de ver la montaña entera; nosotros vamos piedra a piedra.`, acts:[["Respirar","breath",""],["Descarga mental","dump",""],["Solo 10 minutos","focus",(smallest()?.id||"") + "|10"]]}),
  sad: () => ({html:`Siento que estés así. Hoy no hace falta rendir al máximo: un bloque pequeño o simplemente descansar bien también vale. Habla con alguien de confianza, sal a caminar 15 minutos o escribe lo que sientes en Mente.<br>Si esto dura semanas, no duermes o nada te apetece, pide cita en el servicio de atención psicológica de la UPF: es gratuito para estudiantes y pedir ayuda también es cuidarte.`, acts:[["Ir a Calma","go","calma"]]}),
  fail: (x) => ({html:`Un mal día o un mal resultado no te define; es información. Pregúntate qué falló (¿tiempo, método, descanso?) y cambia una sola cosa. ${x.st ? `Recuerda que llevas ${x.st} día${x.st>1?"s":""} de racha y ` : ""}${S.sessions.length ? `ya has hecho ${S.sessions.length} bloques de estudio: eso no desaparece.` : "cada bloque que hagas cuenta."} Mañana empieza en blanco.`, acts:[x.startAct, ["Cerrar el día","go","hoy"]]}),
  nomot: (x) => ({html:`${S.settings.why ? `Recuerda tu porqué: <i>«${esc(S.settings.why)}»</i>. ` : ""}La motivación casi nunca llega antes de empezar; llega después. Comprométete solo a <b>5 minutos</b>. Si después quieres parar, para. ${coins() ? `Además, con cada 5 minutos ganas 1 moneda: tienes ${coins()}.` : ""}`, acts:[["Solo 5 minutos","focus",(x.nt?.id||"") + "|5"], ["Ver recompensas","go","progreso"]]}),
  procras: (x) => ({html:`Procrastinar no es pereza: es evitar una emoción incómoda (aburrimiento, miedo a hacerlo mal). Trucos que funcionan:<ul><li>Haz la tarea ridículamente pequeña: «abrir el PDF y leer una página».</li><li>Decide dónde y cuándo: «a las 17:00 en la biblioteca, ejercicios del tema 3».</li><li>Quita la fricción: móvil en otra habitación, solo una pestaña abierta.</li></ul>`, acts:[["Empezar 10 minutos","focus",(x.nt?.id||"") + "|10"]]}),
  focus: () => ({html:`Para concentrarte más:<ul><li>Antes del bloque, escribe qué quieres conseguir en concreto.</li><li>Móvil fuera de la habitación, no solo boca abajo.</li><li>Cada vez que te distraigas, pulsa «Me he distraído» y vuelve sin juzgarte: la atención se entrena así.</li><li>Prueba el ruido marrón o la lluvia de Foco y el modo zen.</li><li>Si te cuesta mucho, bloques de 15 minutos y ve subiendo.</li></ul>`, acts:[["Ir a Foco","go","foco"]]}),
  phone: () => ({html:`El móvil es el mayor ladrón de concentración: aunque no lo mires, tenerlo a la vista reduce tu rendimiento. Lo que funciona:<ul><li>Fuera de la habitación durante el bloque.</li><li>Modo «No molestar» o modo concentración con solo llamadas de favoritos.</li><li>Las redes, solo en la pausa larga y con temporizador.</li><li>Quita las notificaciones de todo lo que no sea una persona.</li></ul>`, acts:[["Empezar un bloque sin móvil","focus",""]]}),
  tired: () => ({html:`Estudiar cansado rinde poco. Opciones:<ul><li>Si es sueño de verdad, una siesta de 20 minutos (no más) o dormir antes hoy: el sueño consolida lo estudiado.</li><li>Si es cansancio mental, 10 minutos de paseo o estiramientos y agua.</li><li>Cambia a algo ligero: repasar tarjetas o organizar la semana.</li></ul>Intenta dormir 7–9 horas; las noches en vela antes de un examen empeoran la nota.`, acts:[["Repasar tarjetas","review",""]]}),
  howstudy: () => ({html:`Las técnicas con más evidencia:<ul><li><b>Recuerdo activo</b>: cierra los apuntes y escribe o di lo que recuerdas. Mucho mejor que releer o subrayar.</li><li><b>Repetición espaciada</b>: repasa a los 1, 3, 7 y 14 días. La sección Repasar lo hace por ti.</li><li><b>Práctica intercalada</b>: mezcla tipos de ejercicios o temas.</li><li><b>Feynman</b>: explícalo como a alguien de primero; donde te atascas, ahí está el hueco.</li><li><b>Ejemplos concretos</b>: conecta cada concepto con un caso real.</li></ul>`, acts:[["Crear tarjetas","go","repasar"]]}),
  notes: () => ({html:`Apuntes que sirven: escribe con tus palabras, no copies. Usa el método Cornell: a la derecha las notas, a la izquierda preguntas clave, abajo un resumen de 2 líneas. Tras cada clase, convierte 3–5 ideas en tarjetas. Subrayar sin más da sensación de estudiar pero apenas ayuda a recordar.`, acts:[["Crear tarjetas","go","repasar"]]}),
  math: () => ({html:`Matemáticas se aprende haciendo, no leyendo:<ul><li>Primero intenta el ejercicio sin mirar la solución; atascarse un rato es parte del aprendizaje.</li><li>Después compara y apunta el error en una hoja de errores típicos.</li><li>Mezcla tipos de problemas (derivadas, optimización, matrices) para aprender a reconocer cuál toca.</li><li>Haz los exámenes de otros años cronometrados.</li><li>Si un paso no lo entiendes, apúntalo como duda y llévalo a tutoría.</li></ul>`, acts:[["Bloque de ejercicios (50 min)","focus","|50|" + (S.subjects.find(s => /matem/i.test(s.name))?.id||"")]]}),
  philo: () => ({html:`Para Filosofía:<ul><li>Para cada autor, una ficha: problema que intenta resolver, tesis, argumentos y críticas.</li><li>Comentario de texto: 1) sitúa autor y obra, 2) idea principal en una frase, 3) estructura argumentativa, 4) relación con el resto de su pensamiento, 5) valoración crítica o actualidad.</li><li>Compara autores sobre el mismo tema (Hobbes, Locke y Rousseau sobre el contrato social): es lo que suelen preguntar.</li></ul>`, acts:[["Explícame el contrato social","say","explícame el contrato social"]]}),
  politics: () => ({html:`En Ciencia Política, domina los conceptos (Estado, legitimidad, democracia, sistemas electorales) y conéctalos con casos reales: España, la UE o elecciones recientes. Para cada tema: definición, autor de referencia y un ejemplo actual. Leer prensa internacional 10 minutos al día también es estudiar.`, acts:[["Explícame la ley D'Hondt","say","que es la ley d'hondt"]]}),
  law: () => ({html:`Para Derecho Constitucional:<ul><li>Estudia con la Constitución al lado y localiza cada artículo que se menciona.</li><li>Haz esquemas de procedimientos (reforma, moción de censura, recurso de amparo) como diagramas de pasos.</li><li>Memoriza los números de artículos clave con tarjetas.</li><li>Practica casos prácticos: identifica qué derecho está en juego y qué vía de protección hay.</li></ul>`, acts:[["Explícame la reforma constitucional","say","que es la reforma constitucional"]]}),
  history: () => ({html:`Para Historia: primero una línea del tiempo con los grandes periodos, luego rellena. Para cada acontecimiento: causas, desarrollo, consecuencias. Las fechas se fijan mejor con tarjetas y conectándolas entre sí (la crisis del 29 ayuda a entender el ascenso del fascismo). Relaciona siempre con la Política y la Economía de tu grado.`, acts:[["Crear tarjetas de fechas","go","repasar"]]}),
  essay: () => ({html:`Estructura de un ensayo o trabajo:<ul><li>Introducción: contexto, pregunta y tesis en una frase.</li><li>Desarrollo: un argumento por párrafo, con evidencia o autor.</li><li>Objeción principal y tu respuesta: sube mucho la nota.</li><li>Conclusión: responde a la pregunta, sin ideas nuevas.</li></ul>Escribe un primer borrador rápido y feo; corregir es más fácil que empezar. Cita siempre (APA o el estilo que pida el profesor).`, acts:[["Añadir tarea de ensayo","say","añade entrega del ensayo"]]}),
  oral: () => ({html:`Para una exposición: una idea por diapositiva, poco texto, y ensaya en voz alta 2 o 3 veces cronometrando. Empieza con una pregunta o un dato que enganche y termina con la idea que quieres que recuerden. Los nervios bajan muchísimo con el ensayo.`}),
  group: () => ({html:`Trabajos en grupo sin dramas: el primer día repartid tareas con nombre y fecha, poned una fecha interna 2 días antes de la entrega real y usad un documento compartido. Si alguien no aporta, habladlo pronto y con hechos concretos.`}),
  reading: () => ({html:`${S.readings.filter(r => !readingInfo(r).done).length ? "Tus lecturas:<ul>" + S.readings.filter(r => !readingInfo(r).done).map(r => { const ri = readingInfo(r); return `<li><b>${esc(r.title)}</b>: p. ${r.read||0} de ${r.pages}${ri.perDay ? `, ${ri.perDay} págs/día hasta ${whenTxt(r.due)}` : ""}</li>`; }).join("") + "</ul>" : ""}Para lecturas largas: primero un vistazo (índice, introducción, conclusiones), luego lee con una pregunta en mente. Al acabar cada sección, cierra el texto y escribe 3 líneas de lo que dice. Divide la lectura en bloques de 25 minutos y apúntala como tarea de tipo Lectura.`, acts:[["Empezar a leer (25 min)","focus","|25"]]}),
  time: () => { const tot = S.subjects.reduce((a,s) => a + (s.weekly??4), 0); return {html:`Un crédito ECTS son 25–30 horas de trabajo total. Con ${S.subjects.length || 5} asignaturas de 6 ECTS, calcula unas ${tot || 20} horas de estudio propio a la semana además de las clases. Tu meta diaria está en ${fmtMin(S.settings.dailyGoal)}; constancia antes que maratones: 2 horas diarias ganan a 10 horas el domingo.`, acts:[["Ajustar meta","settings",""]]}; },
  breaks: () => ({html:`Las pausas son parte del estudio: el cerebro consolida mientras descansas. En la pausa, levántate, camina, bebe agua o mira por la ventana. Evita las redes: no descansan la atención. Cada 4 bloques, pausa larga de 15–30 minutos.`}),
  health: () => ({html:`Lo básico rinde más que cualquier truco: dormir 7–9 horas, moverte a diario (30 minutos de paseo mejoran la memoria), comer de verdad y beber agua. El café ayuda, pero no después de las 16:00 si quieres dormir bien.`}),
  rewards: () => {

function coachAsk(text){
  text = String(text||"").trim(); if (!text) return;
  coachMsgs.push({role:"me", text});
  let r; try { r = coachReply(text); } catch(e){ r = {html:"Algo se me ha cruzado. Prueba a decirlo de otra forma."}; }
  coachMsgs.push({role:"ai", html:r.html, acts:r.acts||[]});
  saveCoach();
  if (view === "coach"){ render(); const c = $("#coach-chat"); if (c) c.scrollTop = c.scrollHeight; $("#coach-in")?.focus(); }
}
function coachDo(kind, arg){
  if (kind === "say") return coachAsk(arg);
  if (kind === "go") return go(arg);
  if (kind === "settings") return openSettings();
  if (kind === "sync-wizard") return openSyncWizard();
  if (kind === "plan-subjects"){ planTab = "asignaturas"; return go("plan"); }
  if (kind === "auto-plan"){ planTab = "semana"; weekOff = 0; apPreview = autoPlan(); return go("plan"); }
  if (kind === "plan-week"){ planTab = "semana"; return go("plan"); }
  if (kind === "breath"){ breathStop(); br.on = true; go("calma"); setTimeout(() => breathStep(0), 80); br.end = setTimeout(() => { if (br.on){ breathStop(); if (view === "calma") render(); toast("Un minuto hecho. ¿Siguiente paso?"); } }, 64000); return; }
  if (kind === "dump"){ noteKind = "descarga"; go("mente"); setTimeout(() => $("#note-text")?.focus(), 50); return; }
  if (kind === "review") return startReview("");
  if (kind === "today"){ const t = S.tasks.find(x => x.id === arg); if (t){ t.plan = dkey(); save(); toast("Planificada para hoy"); } return; }
  if (kind === "exam-plan"){ const t = S.tasks.find(x => x.id === arg); if (t){ const n = examPlan(t); toast(n ? "Creadas " + n + " sesiones de repaso" : "Demasiado cerca para un plan espaciado"); coachAsk("mi próximo examen"); } return; }
  if (kind === "duda"){ S.notes.push({id:uid(), kind:"duda", text:arg, subjectId:"", ts:Date.now()}); save(); toast("Guardada como duda en Mente"); return; }
  if (kind === "card"){ const c = KB_N.find(x => x.t === arg); if (c && !S.cards.some(k => k.q === "Explica: " + c.t)){ S.cards.push({id:uid(), subjectId:(S.subjects.find(s => c.area.toLowerCase().includes(norm(s.name).split(" ")[0]))||{}).id||"", q:"Explica: " + c.t, a:c.d, due:dkey(), created:Date.now()}); save(); toast("Tarjeta creada en Repasar"); } return; }
  if (kind === "focus"){
    const [tid, mins, sid, intent] = String(arg||"").split("|");
    const t = tid ? S.tasks.find(x => x.id === tid) : null;
    if (!t && sid){ T.subjectId = sid; T.taskId = ""; }
    if (intent) T.intention = intent;
    return startFocusOn(t, mins ? +mins : 0);
  }
}

function completeTask(t){
  t.done = !t.done; t.doneAt = t.done ? Date.now() : 0;

    gainXP(10);
    if (t.repeat && !t.repeated){ t.repeated = true; S.tasks.push({...t, id:uid(), done:false, doneAt:0, repeated:false, checklist:(t.checklist||[]).map(c => ({...c, id:uid(), done:false})), due:t.due?addDays(t.due,7):"", plan:t.plan?addDays(t.plan,7):"", created:Date.now()}); }

function startFocusOn(task, minutes){

}
document.addEventListener("click", e => {
  const goEl = e.target.closest("[data-go]");
  const actEl = e.target.closest("[data-act]");
  if (goEl && (!actEl || actEl.contains(goEl))) { if (S.onboarded) { if (goEl.dataset.go === "repasar") rv = null; go(goEl.dataset.go); } return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  const row = a.closest("[data-id]"), tid = a.dataset.id || row?.dataset.id;
  const task = tid ? S.tasks.find(t => t.id === tid) : null;
  const DEL = {"del-task":"Tarea borrada","et-del":"Tarea borrada","subj-del":"Asignatura borrada","tt-del":"Clase borrada","card-del":"Tarjeta borrada","note-del":"Nota borrada","reward-del":"Recompensa borrada","topic-del":"Tema borrado","eval-del":"Parte borrada","link-del":"Enlace borrado","habit-del":"Hábito borrado","rd-del":"Lectura borrada","ctl-drop":"Soltado"};
  const snapBefore = DEL[act] ? JSON.stringify(S) : null;
  try { handleAct(act, a, e, task); } finally {
    if (snapBefore && JSON.stringify(S) !== snapBefore){ undoSnap = snapBefore; toastUndo(DEL[act]); }
  }
});
function handleAct(act, a, e, task){
  switch(act){
    case "ob-pick": { const n = a.dataset.name; obPicked = obPicked.includes(n) ? obPicked.filter(x => x !== n) : [...obPicked, n]; S.name = $("#ob-name").value.trim(); S.settings.why = $("#ob-why").value.trim(); render(); break; }
    case "ob-add": { const v = $("#ob-custom").value.trim(); if (v && !obPicked.includes(v)) obPicked.push(v); S.name = $("#ob-name").value.trim(); S.settings.why = $("#ob-why").value.trim(); render(); setTimeout(() => $("#ob-custom")?.focus()); break; }
    case "ob-done": {
      S.name = $("#ob-name").value.trim(); S.settings.why = $("#ob-why").value.trim(); S.settings.termStart = $("#ob-term").value || S.settings.termStart;
      S.settings.dailyGoal = Math.max(15, parseInt($("#ob-goal").value)||120);
      const existing = new Set(S.subjects.map(s => s.name));
      obPicked.forEach(n => { if (!existing.has(n)) S.subjects.push({id:uid(), name:n, color:COLORS[S.subjects.length % COLORS.length], ects:6, weekly:4}); });
      if (!S.rewards.length) S.rewards = DEFAULT_REWARDS.map(([text,cost]) => ({id:uid(), text, cost}));
      if (!S.habits.length) S.habits = DEFAULT_HABITS();
      S.onboarded = true; save(); go("hoy"); toast(S.subjects.length ? "Listo. Apunta tus próximas entregas y exámenes en Plan." : "Listo. Puedes añadir asignaturas en Plan."); break; }
    case "more": openMore(); break;
    case "capture": if (S.onboarded) openCapture(); break;
    case "cap-kind": { const keep = $("#cap-text")?.value || ""; capKind = a.dataset.v; openCapture(); $("#cap-text").value = keep; break; }

    case "asig-addtask": planFilter = curSubj; planTab = "lista"; go("plan"); setTimeout(() => $("#nt-title")?.focus(), 50); break;
    case "topic-add": { const lines = $("#tp-new").value.split("\n").map(x => x.trim()).filter(Boolean); lines.forEach(name => S.topics.push({id:uid(), subjectId:curSubj, name:name.slice(0,160), level:0})); if (lines.length){ save(); render(); toast("Añadidos " + lines.length + " temas"); } break; }
    case "topic-level": { const tp = S.topics.find(x => x.id === a.closest("[data-tid]").dataset.tid); const v = +a.dataset.v; if (tp){ if (v > (tp.level||0)){ S.topicUps[dkey()] = (S.topicUps[dkey()]||0) + 1; gainXP(5, true); if (v === 3) toast("Tema dominado. +5 XP"); } tp.level = v; tp.last = Date.now(); save(); render(); a.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b === a))); } break; }
    case "topic-del": { const id = a.closest("[data-tid]").dataset.tid; S.topics = S.topics.filter(x => x.id !== id); save(); render(); break; }
    case "topic-study": { const tp = S.topics.find(x => x.id === a.closest("[data-tid]").dataset.tid); if (tp){ T.subjectId = tp.subjectId; T.taskId = ""; T.intention = "Tema: " + tp.name; startFocusOn(null); } break; }
    case "eval-add": S.evals.push({id:uid(), subjectId:curSubj, name:"Nueva parte", weight:0, grade:"", min:""}); save(); render(); break;
    case "eval-tpl": { const c = +a.dataset.v; S.evals.push({id:uid(), subjectId:curSubj, name:"Evaluación continua", weight:c, grade:"", min:""}, {id:uid(), subjectId:curSubj, name:"Examen final", weight:100-c, grade:"", min:""}); save(); render(); break; }
    case "eval-del": { const id = a.closest("[data-eid]").dataset.eid; S.evals = S.evals.filter(x => x.id !== id); save(); render(); break; }
    case "link-add": { const title = $("#ln-title").value.trim(); let url = $("#ln-url").value.trim(); if (!url){ toast("Pega la dirección del enlace."); break; } if (!/^https?:\/\//i.test(url)) url = "https://" + url; S.links.push({id:uid(), subjectId:curSubj, title:title || url.replace(/^https?:\/\//, "").slice(0,40), url}); save(); render(); break; }
    case "link-del": { const id = a.closest("[data-lid]").dataset.lid; S.links = S.links.filter(x => x.id !== id); save(); render(); break; }
    case "mon-prev": monOff--; calSel = ""; render(); break;
    case "mon-next": monOff++; calSel = ""; render(); break;
    case "mon-now": monOff = 0; calSel = ""; render(); break;
    case "cal-day": calSel = a.dataset.k; render(); break;
    case "cal-add": { const v = $("#cal-new").value.trim(); if (!v) break; addTask({title:v, type:$("#cal-type").value, due:calSel}); render(); toast("Añadido para el " + shortDate(calSel)); break; }
    case "ics": downloadFile("segunda-mente-fechas.ics", buildICS(), "text/calendar"); toast("Abre el archivo .ics o impórtalo en Google Calendar (Configuración, Importar)."); break;
    case "habit-toggle": { const hid = a.dataset.hid, k = dkey(); S.habitLog[k] = Object.assign({}, S.habitLog[k]); if (S.habitLog[k][hid]){ delete S.habitLog[k][hid]; gainXP(-2, true); } else { S.habitLog[k][hid] = true; gainXP(2, true); if (S.habits.every(h => S.habitLog[k][h.id])) toast("Todos los hábitos de hoy hechos."); } trim(); save(); render(); break; }
    case "habit-edit": habitEdit = !habitEdit; render(); break;
    case "habit-add": { const v = $("#hb-new").value.trim(); if (!v) break; S.habits.push({id:uid(), name:v.slice(0,80)}); save(); render(); setTimeout(() => $("#hb-new")?.focus()); break; }
    case "habit-del": { const id = a.closest("[data-hid]").dataset.hid; S.habits = S.habits.filter(h => h.id !== id); save(); render(); break; }
    case "ch-claim": { const id = a.closest("[data-cid]").dataset.cid, c = weekChallenges().find(x => x.id === id), m = monday(); if (c && c.val >= c.goal && !c.claimed){ S.challenges[m] = Object.assign({}, S.challenges[m], {[id]:Date.now()}); gainXP(c.reward * 5); save(); render(); celebrate(); toast("Reto cumplido: +" + c.reward + " monedas"); } break; }
    case "quiz": startQuiz(a.dataset.sid || ""); break;
    case "quiz-exit": qz = null; render(); break;
    case "qz-pick": { if (!qz || qz.picked != null) break; const q = qz.qs[qz.i], v = +a.dataset.v; qz.picked = v; const c = S.cards.find(x => x.id === q.id);
      if (v === q.ans){ qz.ok++; gainXP(1, true); } else if (c){ c.due = dkey(); c.reps = 0; }
      S.reviewLog[dkey()] = (S.reviewLog[dkey()]||0) + 1; save(); render(); break; }
    case "qz-next": if (qz){ qz.i++; qz.picked = null; render(); if (qz.i >= qz.qs.length) checkBadges(); } break;
    case "coach-send": { const i = $("#coach-in"); const v = i.value; i.value = ""; coachAsk(v); break; }
    case "coach-chip": coachAsk(a.dataset.q); break;
    case "coach-clear": coachMsgs = []; saveCoach(); render(); break;
    case "coach-do": { const m = coachMsgs[+a.dataset.i], ac = m && m.acts && m.acts[+a.dataset.j]; if (ac) coachDo(ac[1], ac[2]); break; }
    case "sync-connect": { const v = $("#sync-token").value.trim(); if (!v){ toast("Pega primero el token."); break; } a.disabled = true; a.textContent = "Conectando…"; gistConnect(v); break; }
    case "sync-now": gistSync().then(() => { toast(syncErr || "Sincronizado"); if ($("#modal-root").innerHTML) openSyncWizard(); }); break;
    case "sync-off": sync = {}; saveSyncCfg(); paintSync(); closeModal(); render(); toast("Este dispositivo ya no sincroniza. Tus datos siguen aquí."); break;
    case "ctl-add": { const v = $("#ctl-in").value.trim(); if (!v) break; S.control.push({id:uid(), text:v, v:a.dataset.v}); save(); render(); setTimeout(() => $("#ctl-in")?.focus()); break; }
    case "ctl-task": { const c = S.control.find(x => x.id === a.dataset.id); addTask({title:c.text}); S.control = S.control.filter(x => x !== c); save(); render(); toast("Convertido en tarea en Plan"); break; }
    case "ctl-drop": S.control = S.control.filter(x => x.id !== a.dataset.id); save(); render(); toast("Soltado. No era tuyo de cargar."); break;
  }
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "t-subj"){ T.subjectId = t.value; const task = S.tasks.find(x => x.id === T.taskId); if (task && task.subjectId !== t.value) T.taskId = ""; saveTimer(); render(); }
  else if (t.id === "t-task"){ T.taskId = t.value; const task = S.tasks.find(x => x.id === t.value); if (task){ T.subjectId = task.subjectId || ""; if (!T.intention) T.intention = task.title; } saveTimer(); render(); }
  else if (t.id === "t-int"){ T.intention = t.value.trim(); saveTimer(); }
  else if (t.id === "auto-next"){ S.settings.autoNext = t.checked; save(); }
  else if (t.id === "s-file"){ const f = t.files && t.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restore(String(r.result)); r.readAsText(f); }
  else if (t.dataset.actChange === "plan-day"){ const task = S.tasks.find(x => x.id === t.closest("[data-id]").dataset.id); if (task && t.value){ task.plan = t.value; save(); render(); } }
  else if (t.dataset.efield && t.closest("[data-eid]")){ const ev = S.evals.find(x => x.id === t.closest("[data-eid]").dataset.eid); if (ev){ const f = t.dataset.efield; ev[f] = f === "name" ? (t.value.trim() || ev.name) : f === "weight" ? Math.max(0, Math.min(100, parseFloat(String(t.value).replace(",", ".")) || 0)) : parseG(t.value); save(); render(); } }
  else if (t.dataset.rfield === "read" && t.closest("[data-rdid]")){ const r = S.readings.find(x => x.id === t.closest("[data-rdid]").dataset.rdid); if (r){ const before = r.read||0; r.read = Math.max(0, Math.min(r.pages, parseInt(t.value) || 0)); if (r.read > before) gainXP(Math.floor((r.read - before)/3), true); save(); render(); } }
  else if (t.dataset.hoyk){ const k = t.dataset.hoyk, h = new Set(S.settings.hoyHidden || []); if (t.checked) h.delete(k); else h.add(k); S.settings.hoyHidden = [...h]; save(); render(); }
  else if (t.id === "s-exits"){ S.settings.trackExits = t.checked; save(); }
  else if (t.id === "as-target"){ const s = subj(curSubj), v = parseG(t.value); if (s && v !== ""){ s.target = v; save(); render(); } }
  else if (t.dataset.field && t.closest("[data-sid]")){ const s = subj(t.closest("[data-sid]").dataset.sid); if (t.dataset.field === "name" && t.value.trim()) s.name = t.value.trim(); if (t.dataset.field === "ects") s.ects = parseInt(t.value)||0; if (t.dataset.field === "weekly") s.weekly = parseFloat(t.value)||0; save(); }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "vol"){ S.settings.vol = +t.value; if (audio.gain) audio.gain.gain.value = S.settings.vol; clearTimeout(t._s); t._s = setTimeout(save, 500); }
  else if (t.id === "gs-q"){ const r = $("#gs-res"); if (r) r.innerHTML = searchResults(t.value); }
  else if (t.id === "note-q"){ noteQ = t.value; const pos = t.selectionStart; render(); const n = $("#note-q"); if (n){ n.focus(); n.setSelectionRange(pos, pos); } }
});
document.addEventListener("keydown", e => {
  const id = e.target.id, typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K") && S.onboarded){ e.preventDefault(); openSearch(); return; }
  if (e.key === "Escape"){ if ($("#modal-root").innerHTML) closeModal(); else if (zen){ zen = false; renderZen(); render(); } return; }
  if (!typing && S.onboarded){
    if (view === "repasar" && qz && qz.i < qz.qs.length){
      if (qz.picked == null && "1234".includes(e.key)){ const b = document.querySelectorAll('[data-act="qz-pick"]')[+e.key-1]; if (b) b.click(); return; }
      if (qz.picked != null && (e.key === " " || e.key === "ArrowRight")){ e.preventDefault(); $('[data-act="qz-next"]')?.click(); return; }
    }
    if (e.key === "/" && !$("#modal-root").innerHTML){ e.preventDefault(); openSearch(); return; }
    if (e.key === "?" && !$("#modal-root").innerHTML){ e.preventDefault(); go("guia"); return; }
    if (view === "repasar" && rv){
      if (e.key === " " && !rv.show){ e.preventDefault(); rv.show = true; render(); return; }
      if (rv.show && "1234".includes(e.key)){ const b = document.querySelectorAll('[data-act="grade"]')[+e.key-1]; if (b) b.click(); return; }
    }
    if ((e.key === "n" || e.key === "N") && !e.metaKey && !e.ctrlKey && !$("#modal-root").innerHTML){ e.preventDefault(); openCapture(); return; }
  }
  if (e.key !== "Enter") return;
  if ((id === "note-text" || id === "cap-text") && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $(id === "note-text" ? '[data-act="add-note"]' : '[data-act="cap-save"]').click(); return; }
  const map = {"nt-title":"add-task", "park":"park", "chat-in":"chat-send", "new-subj":"subj-add", "ob-custom":"ob-add", "ctl-in":null, "rw-text":"reward-add", "et-title":"et-save", "cap-text":"cap-save", "coach-in":"coach-send", "hb-new":"habit-add", "cal-new":"cal-add", "ln-url":"link-add", "rd-title":"rd-new", "cl-new":"cl-add", "sync-token":"sync-connect"};
  if (id in map && map[id] && e.target.tagName === "INPUT") { e.preventDefault(); $(`[data-act="${map[id]}"]`)?.click(); }
  if (id === "t-int"){ e.preventDefault(); T.intention = e.target.value.trim(); saveTimer(); if (!T.running) $('[data-act="t-toggle"]').click(); }
});
document.addEventListener("visibilitychange", () => {
  if (T.running && T.mode === "focus" && S.settings.trackExits){
    if (document.hidden){ T.awayAt = Date.now(); saveTimer(); }
    else if (T.awayAt){
      const secs = Math.round((Date.now() - T.awayAt)/1000); T.awayAt = 0;
      if (secs >= 15 && timeLeft() > 0){ T.distractions++; T.exits = (T.exits||0) + 1; saveTimer(); if (view === "foco") render(); toast(`Has salido ${secs >= 60 ? Math.round(secs/60) + " min" : secs + " s"} de la pestaña. Lo cuento como distracción: vuelve a lo tuyo.`); }
      else saveTimer();
    }
  }
  if (!document.hidden && T.running) { keepAwake(true); if (timeLeft() <= 0) finishBlock(true); }
});

if (!IN_CLAUDE && "serviceWorker" in navigator && location.protocol === "https:") { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch(e){} }
dailyBackup();
applyFreeze();
render();
connect();
syncInit();
linkFromHash();
})();
</script>
